<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:#f8f9fc;color:#1a1a2e;min-height:100vh;overflow-x:auto}
.top-bar{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.5rem;gap:1rem;flex-wrap:wrap}
.top-bar h1{font-size:1.4rem;font-weight:700;letter-spacing:-0.02em;white-space:nowrap}
.top-bar .back{text-decoration:none;color:#6b7280;font-size:.85rem;font-weight:500}
.top-bar .back:hover{color:#3b82f6}
.quick-add{display:flex;gap:.5rem;flex:1;max-width:420px}
.quick-add input{flex:1;padding:.5rem .75rem;border:1px solid rgba(0,0,0,.1);border-radius:10px;font:inherit;font-size:.85rem;background:rgba(255,255,255,.72);backdrop-filter:blur(20px)}
.quick-add input:focus{outline:none;border-color:#3b82f6}
.toolbar{display:flex;align-items:center;gap:.5rem;padding:0 1.5rem .75rem;flex-wrap:wrap}
.toolbar select,.toolbar button{padding:.35rem .65rem;border:1px solid rgba(0,0,0,.08);border-radius:8px;font:inherit;font-size:.78rem;background:rgba(255,255,255,.72);backdrop-filter:blur(10px);cursor:pointer;color:#1a1a2e}
.toolbar select:focus,.toolbar button:focus{outline:none;border-color:#3b82f6}
.toolbar button:hover{background:rgba(59,130,246,.08)}
.btn-primary{background:#3b82f6!important;color:#fff!important;border-color:#3b82f6!important;font-weight:600}
.btn-primary:hover{background:#2563eb!important}
.board{display:flex;gap:1rem;padding:0 1.5rem 1.5rem;min-height:calc(100vh - 160px);align-items:flex-start}
.column{flex:1;min-width:280px;max-width:340px;background:rgba(255,255,255,.45);backdrop-filter:blur(12px);border-radius:14px;border:1px solid rgba(255,255,255,.5);display:flex;flex-direction:column;max-height:calc(100vh - 160px)}
.col-header{padding:.75rem 1rem;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(0,0,0,.04);position:sticky;top:0;background:inherit;border-radius:14px 14px 0 0;z-index:1}
.col-header h2{font-size:.85rem;font-weight:600;display:flex;align-items:center;gap:.4rem}
.col-count{background:rgba(0,0,0,.06);border-radius:20px;padding:1px 8px;font-size:.72rem;font-weight:600}
.wip-warn{color:#ef4444;font-weight:700}
.col-body{padding:.5rem;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:.5rem;min-height:60px}
.col-body.drag-over{background:rgba(59,130,246,.06);border-radius:0 0 14px 14px}
/* Task card */
.task{background:rgba(255,255,255,.72);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1.5px solid rgba(255,255,255,.6);border-radius:12px;padding:.7rem .8rem;cursor:grab;transition:transform .15s,box-shadow .15s,border-color .3s}
.task:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.06)}
.task.dragging{opacity:.4}
.task .task-top{display:flex;align-items:center;gap:.35rem;margin-bottom:.3rem;flex-wrap:wrap}
.task .title{font-size:.82rem;font-weight:600;line-height:1.3;flex:1;min-width:0}
.badge{padding:1px 7px;border-radius:20px;font-size:.65rem;font-weight:600;white-space:nowrap}
.badge-p0{background:#fee2e2;color:#dc2626}
.badge-p1{background:#ffedd5;color:#ea580c}
.badge-p2{background:#dbeafe;color:#2563eb}
.badge-p3{background:#f0fdf4;color:#16a34a}
.tag{padding:1px 7px;border-radius:20px;font-size:.65rem;font-weight:500;background:rgba(0,0,0,.05);color:#6b7280}
.task .meta{display:flex;gap:.6rem;font-size:.7rem;color:#9ca3af;margin-top:.25rem;flex-wrap:wrap}
.task .meta span{display:flex;align-items:center;gap:.2rem}
.task .arrows{display:flex;gap:.2rem;margin-top:.35rem}
.task .arrows button{border:none;background:rgba(0,0,0,.04);border-radius:6px;width:24px;height:22px;cursor:pointer;font-size:.7rem;color:#6b7280;display:flex;align-items:center;justify-content:center}
.task .arrows button:hover{background:rgba(59,130,246,.12);color:#3b82f6}
.task .arrows button:disabled{opacity:.2;cursor:default}
/* Aging */
.age-warn{border-color:#fbbf24!important}
.age-crit{border-color:#ef4444!important}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.3);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:center;justify-content:center}
.modal{background:#fff;border-radius:16px;padding:1.75rem;width:440px;max-width:92vw;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.15)}
.modal h3{font-size:1.1rem;font-weight:700;margin-bottom:1rem}
.modal label{display:block;font-size:.78rem;font-weight:500;margin-bottom:.25rem;color:#6b7280;margin-top:.65rem}
.modal input,.modal select,.modal textarea{width:100%;padding:.5rem .65rem;border:1px solid rgba(0,0,0,.1);border-radius:8px;font:inherit;font-size:.85rem}
.modal textarea{resize:vertical;min-height:60px}
.modal input:focus,.modal select:focus,.modal textarea:focus{outline:none;border-color:#3b82f6}
.modal-actions{display:flex;gap:.5rem;margin-top:1.25rem;justify-content:flex-end}
.modal-actions button{padding:.45rem 1rem;border-radius:8px;border:1px solid rgba(0,0,0,.08);font:inherit;font-size:.82rem;cursor:pointer;font-weight:500}
.modal-actions .save{background:#3b82f6;color:#fff;border-color:#3b82f6}
.modal-actions .save:hover{background:#2563eb}
.modal-actions .delete{color:#ef4444;border-color:#fca5a5}
.modal-actions .delete:hover{background:#fef2f2}

/* Panels */
.panel{position:fixed;right:0;top:0;bottom:0;width:480px;max-width:95vw;background:#fff;box-shadow:-10px 0 40px rgba(0,0,0,.1);z-index:100;display:flex;flex-direction:column;overflow-y:auto}
.panel-header{padding:1.25rem 1.5rem;border-bottom:1px solid rgba(0,0,0,.06);display:flex;align-items:center;justify-content:space-between}
.panel-header h3{font-size:1.05rem;font-weight:700}
.panel-close{border:none;background:none;font-size:1.2rem;cursor:pointer;color:#6b7280}
.panel-body{padding:1.25rem 1.5rem;flex:1}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
.stat-card{background:#f8f9fc;border-radius:10px;padding:.75rem;text-align:center}
.stat-card .val{font-size:1.5rem;font-weight:700}
.stat-card .lbl{font-size:.72rem;color:#6b7280;margin-top:.15rem}
.chart-area{margin-top:1.25rem}
.chart-area h4{font-size:.85rem;font-weight:600;margin-bottom:.5rem}
.chart-bar{display:flex;align-items:flex-end;gap:4px;height:120px;padding-top:10px}
.chart-bar .bar{flex:1;background:#3b82f6;border-radius:4px 4px 0 0;min-width:12px;position:relative;transition:height .3s}
.chart-bar .bar span{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:.6rem;color:#6b7280}
.chart-bar .bar-label{font-size:.55rem;color:#9ca3af;text-align:center;margin-top:2px;width:100%;position:absolute;bottom:-14px;left:0}
.archive-item{padding:.5rem 0;border-bottom:1px solid rgba(0,0,0,.04);font-size:.82rem;display:flex;justify-content:space-between;align-items:center}
.archive-item .arch-title{font-weight:500}
.archive-item .arch-meta{font-size:.7rem;color:#9ca3af}
.wip-setting{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;font-size:.82rem}
.wip-setting input{width:50px;text-align:center}
.project-bar{display:flex;align-items:center;gap:.5rem;margin-bottom:.35rem;font-size:.78rem}
.project-bar .pbar{flex:1;height:8px;background:#e5e7eb;border-radius:4px;overflow:hidden}
.project-bar .pbar div{height:100%;border-radius:4px}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="top-bar">
  <div style="display:flex;align-items:center;gap:1rem">
    <a href="index.html" class="back">&larr; Analytics</a>
    <h1>Kanban Board</h1>
  </div>
  <div class="quick-add">
    <input type="text" id="quickAdd" placeholder="Quick add task to Backlog... (Enter)">
  </div>
  <div style="display:flex;gap:.4rem">
    <button class="toolbar-btn" onclick="openAddModal()" title="Add task" style="border:none;background:rgba(59,130,246,.1);border-radius:8px;width:32px;height:32px;cursor:pointer;color:#3b82f6;font-size:1.1rem;display:flex;align-items:center;justify-content:center">+</button>
  </div>
</div>
<div class="toolbar">
  <select id="filterProject"><option value="">All Projects</option></select>
  <select id="filterPriority"><option value="">All Priorities</option><option value="0">P0 Critical</option><option value="1">P1 High</option><option value="2">P2 Medium</option><option value="3">P3 Low</option></select>
  <select id="filterDue"><option value="">All Dates</option><option value="overdue">Overdue</option><option value="week">This Week</option><option value="month">This Month</option></select>
  <div style="flex:1"></div>
  <button onclick="openStats()">Stats</button>
  <button onclick="openArchive()">Archive</button>
  <button onclick="openSettings()">WIP Limits</button>
  <button onclick="exportJSON()">Export JSON</button>
</div>
<div class="board" id="board"></div>

<!-- Modal for add/edit -->
<div class="overlay hidden" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <h3 id="modalTitle">Add Task</h3>
    <input type="hidden" id="taskId">
    <label>Title *</label>
    <input type="text" id="fTitle" placeholder="Task title">
    <label>Description</label>
    <textarea id="fDesc" placeholder="Optional description"></textarea>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:.75rem">
      <div><label>Priority</label><select id="fPriority"><option value="0">P0 Critical</option><option value="1">P1 High</option><option value="2" selected>P2 Medium</option><option value="3">P3 Low</option></select></div>
      <div><label>Project</label><select id="fProject"></select></div>
      <div><label>Due Date</label><input type="date" id="fDue"></div>
      <div><label>Est. Hours</label><input type="number" id="fHours" min="0" step="0.5" placeholder="0"></div>
    </div>
    <div class="modal-actions">
      <button class="delete hidden" id="btnDelete" onclick="deleteTask()">Delete</button>
      <button onclick="closeModal()">Cancel</button>
      <button class="save" onclick="saveTask()">Save</button>
    </div>
  </div>
</div>

<!-- Stats panel -->
<div class="panel hidden" id="statsPanel">
  <div class="panel-header"><h3>Board Statistics</h3><button class="panel-close" onclick="closePanel('statsPanel')">&times;</button></div>
  <div class="panel-body" id="statsBody"></div>
</div>

<!-- Archive panel -->
<div class="panel hidden" id="archivePanel">
  <div class="panel-header"><h3>Archived Tasks</h3><button class="panel-close" onclick="closePanel('archivePanel')">&times;</button></div>
  <div class="panel-body" id="archiveBody"></div>
</div>

<!-- Settings panel -->
<div class="panel hidden" id="settingsPanel">
  <div class="panel-header"><h3>WIP Limits</h3><button class="panel-close" onclick="closePanel('settingsPanel')">&times;</button></div>
  <div class="panel-body" id="settingsBody"></div>
</div>

<script>
const COLUMNS = ['backlog','inprogress','review','done'];
const COL_LABELS = {backlog:'Backlog',inprogress:'In Progress',review:'Review',done:'Done'};
const PROJECTS = ['CIBC','Smara','Lumen','Scoper','PJ Tales','Personal'];
const PRIORITY_LABELS = ['P0 Critical','P1 High','P2 Medium','P3 Low'];
const PROJECT_COLORS = {CIBC:'#3b82f6',Smara:'#8b5cf6',Lumen:'#f59e0b',Scoper:'#10b981','PJ Tales':'#ec4899',Personal:'#6366f1'};

const LS_KEY = 'kanban_tasks';
const LS_ARCHIVE = 'kanban_archive';
const LS_WIP = 'kanban_wip';
const LS_BURNDOWN = 'kanban_burndown';

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function today(){return new Date().toISOString().split('T')[0]}

function loadTasks(){
  const d = localStorage.getItem(LS_KEY);
  if(d) return JSON.parse(d);
  return seedTasks();
}
function saveTasks(t){localStorage.setItem(LS_KEY,JSON.stringify(t))}
function loadArchive(){return JSON.parse(localStorage.getItem(LS_ARCHIVE)||'[]')}
function saveArchive(a){localStorage.setItem(LS_ARCHIVE,JSON.stringify(a))}
function loadWip(){return JSON.parse(localStorage.getItem(LS_WIP)||'{"backlog":0,"inprogress":4,"review":3,"done":0}')}
function saveWip(w){localStorage.setItem(LS_WIP,JSON.stringify(w))}
function loadBurndown(){return JSON.parse(localStorage.getItem(LS_BURNDOWN)||'{}')}
function saveBurndown(b){localStorage.setItem(LS_BURNDOWN,JSON.stringify(b))}

function seedTasks(){
  const now = Date.now();
  const d = (days)=>new Date(now+days*86400000).toISOString().split('T')[0];
  const tasks = [
    {id:uid(),title:'Cloud migration architecture review',desc:'Review full migration plan for Azure/GCP workloads',priority:0,project:'CIBC',col:'inprogress',due:d(2),hours:8,created:d(-4),movedAt:now-4*86400000},
    {id:uid(),title:'Set up Stripe webhook env vars on Railway',desc:'Configure STRIPE_WEBHOOK_SECRET in Railway dashboard',priority:1,project:'Smara',col:'backlog',due:d(3),hours:1,created:d(-2),movedAt:now-2*86400000},
    {id:uid(),title:'Write Product Hunt launch copy',desc:'Headline, tagline, screenshots, first comment',priority:1,project:'Smara',col:'backlog',due:d(5),hours:3,created:d(-1),movedAt:now-86400000},
    {id:uid(),title:'Add rate limiting to API',desc:'Implement Redis-based rate limiter middleware',priority:2,project:'Smara',col:'backlog',due:d(10),hours:4,created:d(-3),movedAt:now-3*86400000},
    {id:uid(),title:'Build estimation demo',desc:'Interactive demo for Scoper estimation pipeline',priority:1,project:'Scoper',col:'inprogress',due:d(4),hours:6,created:d(-5),movedAt:now-3*86400000},
    {id:uid(),title:'Add analytics sidebar link to dashboard',desc:'Wire up analytics index in Lumen sidebar nav',priority:2,project:'Lumen',col:'backlog',due:d(7),hours:1,created:d(-1),movedAt:now-86400000},
    {id:uid(),title:'Set up Sage story generation cron',desc:'Schedule nightly story generation via Sage model',priority:2,project:'PJ Tales',col:'backlog',due:d(8),hours:3,created:d(-2),movedAt:now-2*86400000},
    {id:uid(),title:'File Q1 taxes',desc:'CRA quarterly filing with HST remittance',priority:1,project:'Personal',col:'review',due:d(1),hours:2,created:d(-6),movedAt:now-2*86400000},
    {id:uid(),title:'Organize photo backup',desc:'Consolidate iCloud, Google Photos, NAS',priority:3,project:'Personal',col:'backlog',due:d(14),hours:2,created:d(-1),movedAt:now-86400000},
    {id:uid(),title:'Update data lineage documentation',desc:'Add new Delta Lake tables to lineage docs',priority:2,project:'CIBC',col:'inprogress',due:d(3),hours:4,created:d(-8),movedAt:now-5*86400000},
    {id:uid(),title:'Publish dev.to articles',desc:'Cross-post Smara technical blog posts',priority:1,project:'Smara',col:'review',due:d(2),hours:2,created:d(-3),movedAt:now-86400000},
    {id:uid(),title:'Fix TCC permissions for 3 services',desc:'Reset TCC DB entries for Ollama, Redis, cron',priority:2,project:'Lumen',col:'backlog',due:d(5),hours:1,created:d(-4),movedAt:now-4*86400000},
  ];
  saveTasks(tasks);
  return tasks;
}

/* Auto-archive: done tasks older than 7 days */
function autoArchive(tasks){
  const cutoff = Date.now()-7*86400000;
  const archive = loadArchive();
  const keep = [];
  tasks.forEach(t=>{
    if(t.col==='done' && t.movedAt && t.movedAt < cutoff){
      t.archivedAt = today();
      archive.push(t);
    } else keep.push(t);
  });
  saveArchive(archive);
  return keep;
}

/* Record burndown */
function recordDone(tasks){
  const bd = loadBurndown();
  const d = today();
  bd[d] = tasks.filter(t=>t.col==='done').length;
  saveBurndown(bd);
}

let tasks = autoArchive(loadTasks());
saveTasks(tasks);
recordDone(tasks);

/* Populate project selects */
function populateProjectSelects(){
  const fp = document.getElementById('filterProject');
  const modal = document.getElementById('fProject');
  PROJECTS.forEach(p=>{
    fp.innerHTML += `<option value="${p}">${p}</option>`;
    modal.innerHTML += `<option value="${p}">${p}</option>`;
  });
}
populateProjectSelects();

/* Render board */
function render(){
  const fp = document.getElementById('filterProject').value;
  const fpr = document.getElementById('filterPriority').value;
  const fd = document.getElementById('filterDue').value;
  const wip = loadWip();
  const now = Date.now();
  const board = document.getElementById('board');
  board.innerHTML = '';

  COLUMNS.forEach(col=>{
    const colEl = document.createElement('div');
    colEl.className = 'column';
    colEl.dataset.col = col;

    let colTasks = tasks.filter(t=>t.col===col);
    let filtered = colTasks.filter(t=>{
      if(fp && t.project!==fp) return false;
      if(fpr!=='' && String(t.priority)!==fpr) return false;
      if(fd){
        if(!t.due) return fd==='month';
        const due = new Date(t.due+'T23:59:59');
        const n = new Date();
        if(fd==='overdue') return due < new Date(today()+'T00:00:00');
        if(fd==='week'){const end=new Date();end.setDate(end.getDate()+(7-end.getDay()));return due<=end&&due>=new Date(today()+'T00:00:00')}
        if(fd==='month'){const end=new Date(n.getFullYear(),n.getMonth()+1,0);return due<=end&&due>=new Date(today()+'T00:00:00')}
      }
      return true;
    });

    const wipLimit = wip[col]||0;
    const overWip = wipLimit>0 && colTasks.length > wipLimit;

    colEl.innerHTML = `<div class="col-header"><h2>${COL_LABELS[col]} <span class="col-count ${overWip?'wip-warn':''}">${colTasks.length}${wipLimit?'/'+wipLimit:''}</span></h2></div>`;
    const body = document.createElement('div');
    body.className = 'col-body';
    body.dataset.col = col;

    /* Drag events */
    body.addEventListener('dragover',e=>{e.preventDefault();body.classList.add('drag-over')});
    body.addEventListener('dragleave',()=>body.classList.remove('drag-over'));
    body.addEventListener('drop',e=>{
      e.preventDefault();
      body.classList.remove('drag-over');
      const id = e.dataTransfer.getData('text/plain');
      moveTask(id, col);
    });

    filtered.forEach(t=>{
      const card = document.createElement('div');
      card.className = 'task';
      card.draggable = true;
      card.dataset.id = t.id;

      /* Aging */
      if(t.movedAt && col!=='done'){
        const days = (now - t.movedAt)/86400000;
        if(days>=7) card.classList.add('age-crit');
        else if(days>=3) card.classList.add('age-warn');
      }

      card.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',t.id);card.classList.add('dragging')});
      card.addEventListener('dragend',()=>card.classList.remove('dragging'));
      card.addEventListener('dblclick',()=>openEditModal(t.id));

      const ci = COLUMNS.indexOf(col);
      const isOverdue = t.due && new Date(t.due+'T23:59:59') < new Date(today()+'T00:00:00');
      card.innerHTML = `
        <div class="task-top">
          <span class="badge badge-p${t.priority}">${PRIORITY_LABELS[t.priority].split(' ')[0]}</span>
          <span class="tag" style="background:${PROJECT_COLORS[t.project]||'#6b7280'}22;color:${PROJECT_COLORS[t.project]||'#6b7280'}">${t.project}</span>
        </div>
        <div class="title">${esc(t.title)}</div>
        <div class="meta">
          ${t.due?`<span style="${isOverdue?'color:#ef4444;font-weight:600':''}">${isOverdue?'Overdue: ':''}${t.due}</span>`:''}
          ${t.hours?`<span>${t.hours}h</span>`:''}
        </div>
        <div class="arrows">
          <button ${ci===0?'disabled':''} onclick="event.stopPropagation();moveTask('${t.id}','${COLUMNS[ci-1]||col}')" title="Move left">&larr;</button>
          <button ${ci===COLUMNS.length-1?'disabled':''} onclick="event.stopPropagation();moveTask('${t.id}','${COLUMNS[ci+1]||col}')" title="Move right">&rarr;</button>
          <button onclick="event.stopPropagation();openEditModal('${t.id}')" title="Edit" style="margin-left:auto">&#9998;</button>
        </div>
      `;
      body.appendChild(card);
    });
    colEl.appendChild(body);
    board.appendChild(colEl);
  });
}

function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}

function moveTask(id,toCol){
  const t = tasks.find(x=>x.id===id);
  if(!t||t.col===toCol) return;
  t.col = toCol;
  t.movedAt = Date.now();
  if(toCol==='done') t.doneAt = today();
  saveTasks(tasks);
  recordDone(tasks);
  render();
}

/* Quick add */
document.getElementById('quickAdd').addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    const v = e.target.value.trim();
    if(!v) return;
    tasks.push({id:uid(),title:v,desc:'',priority:2,project:'Personal',col:'backlog',due:'',hours:0,created:today(),movedAt:Date.now()});
    saveTasks(tasks);
    e.target.value='';
    render();
  }
});

/* Modal */
function openAddModal(){
  document.getElementById('modalTitle').textContent='Add Task';
  document.getElementById('taskId').value='';
  document.getElementById('fTitle').value='';
  document.getElementById('fDesc').value='';
  document.getElementById('fPriority').value='2';
  document.getElementById('fProject').value='Personal';
  document.getElementById('fDue').value='';
  document.getElementById('fHours').value='';
  document.getElementById('btnDelete').classList.add('hidden');
  document.getElementById('modalOverlay').classList.remove('hidden');
  setTimeout(()=>document.getElementById('fTitle').focus(),50);
}
function openEditModal(id){
  const t = tasks.find(x=>x.id===id);
  if(!t) return;
  document.getElementById('modalTitle').textContent='Edit Task';
  document.getElementById('taskId').value=id;
  document.getElementById('fTitle').value=t.title;
  document.getElementById('fDesc').value=t.desc||'';
  document.getElementById('fPriority').value=t.priority;
  document.getElementById('fProject').value=t.project;
  document.getElementById('fDue').value=t.due||'';
  document.getElementById('fHours').value=t.hours||'';
  document.getElementById('btnDelete').classList.remove('hidden');
  document.getElementById('modalOverlay').classList.remove('hidden');
}
function closeModal(){document.getElementById('modalOverlay').classList.add('hidden')}
function saveTask(){
  const id = document.getElementById('taskId').value;
  const title = document.getElementById('fTitle').value.trim();
  if(!title) return;
  if(id){
    const t = tasks.find(x=>x.id===id);
    if(t){t.title=title;t.desc=document.getElementById('fDesc').value;t.priority=+document.getElementById('fPriority').value;t.project=document.getElementById('fProject').value;t.due=document.getElementById('fDue').value;t.hours=+document.getElementById('fHours').value||0}
  } else {
    tasks.push({id:uid(),title,desc:document.getElementById('fDesc').value,priority:+document.getElementById('fPriority').value,project:document.getElementById('fProject').value,col:'backlog',due:document.getElementById('fDue').value,hours:+document.getElementById('fHours').value||0,created:today(),movedAt:Date.now()});
  }
  saveTasks(tasks);closeModal();render();
}
function deleteTask(){
  const id = document.getElementById('taskId').value;
  tasks = tasks.filter(t=>t.id!==id);
  saveTasks(tasks);closeModal();render();
}

/* Filters */
['filterProject','filterPriority','filterDue'].forEach(id=>document.getElementById(id).addEventListener('change',render));

/* Stats panel */
function openStats(){
  document.getElementById('statsPanel').classList.remove('hidden');
  const body = document.getElementById('statsBody');
  const total = tasks.length;
  const byStat = {};COLUMNS.forEach(c=>byStat[c]=tasks.filter(t=>t.col===c).length);
  const byProj = {};PROJECTS.forEach(p=>byProj[p]=tasks.filter(t=>t.project===p).length);

  /* Avg cycle time */
  const archive = loadArchive();
  const doneTasks = [...tasks.filter(t=>t.col==='done'),...archive];
  let avgCycle = 0;
  if(doneTasks.length){
    const cycles = doneTasks.filter(t=>t.created&&t.doneAt).map(t=>(new Date(t.doneAt)-new Date(t.created))/86400000);
    if(cycles.length) avgCycle = (cycles.reduce((a,b)=>a+b,0)/cycles.length).toFixed(1);
  }

  /* Burndown chart */
  const bd = loadBurndown();
  const last14 = [];
  for(let i=13;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);last14.push(d.toISOString().split('T')[0])}
  const maxBd = Math.max(1,...last14.map(d=>bd[d]||0));

  body.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="val">${total}</div><div class="lbl">Total Tasks</div></div>
      <div class="stat-card"><div class="val">${avgCycle}</div><div class="lbl">Avg Cycle Time (days)</div></div>
      <div class="stat-card"><div class="val">${byStat.inprogress||0}</div><div class="lbl">In Progress</div></div>
      <div class="stat-card"><div class="val">${byStat.done||0}</div><div class="lbl">Done</div></div>
    </div>
    <div class="chart-area">
      <h4>Tasks by Status</h4>
      <div style="display:flex;gap:.5rem;margin-bottom:1rem">
        ${COLUMNS.map(c=>`<div style="flex:1;text-align:center"><div style="font-size:1.2rem;font-weight:700">${byStat[c]||0}</div><div style="font-size:.7rem;color:#9ca3af">${COL_LABELS[c]}</div></div>`).join('')}
      </div>
    </div>
    <div class="chart-area">
      <h4>Tasks by Project</h4>
      ${PROJECTS.map(p=>{const c=byProj[p]||0;const pct=total?Math.round(c/total*100):0;return`<div class="project-bar"><span style="width:70px">${p}</span><div class="pbar"><div style="width:${pct}%;background:${PROJECT_COLORS[p]}"></div></div><span>${c}</span></div>`}).join('')}
    </div>
    <div class="chart-area">
      <h4>Burndown (Done tasks, last 14 days)</h4>
      <div class="chart-bar" style="position:relative;margin-bottom:20px">
        ${last14.map(d=>{const v=bd[d]||0;const h=Math.max(2,v/maxBd*100);const lbl=d.slice(5);return`<div class="bar" style="height:${h}%"><span>${v}</span><span class="bar-label">${lbl}</span></div>`}).join('')}
      </div>
    </div>
  `;
}

/* Archive panel */
function openArchive(){
  document.getElementById('archivePanel').classList.remove('hidden');
  const body = document.getElementById('archiveBody');
  const archive = loadArchive().sort((a,b)=>(b.archivedAt||'').localeCompare(a.archivedAt||''));
  if(!archive.length){body.innerHTML='<p style="color:#9ca3af;font-size:.85rem">No archived tasks yet. Done tasks auto-archive after 7 days.</p>';return}
  body.innerHTML = archive.map(t=>`<div class="archive-item"><div><div class="arch-title">${esc(t.title)}</div><div class="arch-meta">${t.project} &middot; ${PRIORITY_LABELS[t.priority]}</div></div><div class="arch-meta">${t.archivedAt||''}</div></div>`).join('');
}

/* Settings (WIP limits) */
function openSettings(){
  document.getElementById('settingsPanel').classList.remove('hidden');
  const body = document.getElementById('settingsBody');
  const wip = loadWip();
  body.innerHTML = `<p style="font-size:.82rem;color:#6b7280;margin-bottom:1rem">Set to 0 for no limit. Column header will show warning when exceeded.</p>` +
    COLUMNS.map(c=>`<div class="wip-setting"><label style="width:100px;font-weight:500">${COL_LABELS[c]}</label><input type="number" min="0" value="${wip[c]||0}" onchange="updateWip('${c}',this.value)"></div>`).join('');
}
function updateWip(col,val){
  const wip = loadWip();
  wip[col] = parseInt(val)||0;
  saveWip(wip);
  render();
}

function closePanel(id){document.getElementById(id).classList.add('hidden')}

/* Export */
function exportJSON(){
  const data = {tasks,archive:loadArchive(),wip:loadWip(),burndown:loadBurndown(),exportedAt:new Date().toISOString()};
  const blob = new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`kanban-backup-${today()}.json`;
  a.click();
}

/* Keyboard shortcut */
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeModal();closePanel('statsPanel');closePanel('archivePanel');closePanel('settingsPanel')}
});

render();
</script>
