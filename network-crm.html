<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Network CRM</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:#f8f9fc;color:#1a1a2e;min-height:100vh}
.app{max-width:1280px;margin:0 auto;padding:1.5rem}
h1{font-size:1.75rem;font-weight:700;letter-spacing:-0.02em}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;flex-wrap:wrap;gap:1rem}
.header-left{display:flex;align-items:center;gap:1rem}
.header-left a{color:#6b7280;text-decoration:none;font-size:0.85rem}
.header-left a:hover{color:#3b82f6}
.header-actions{display:flex;gap:0.5rem;flex-wrap:wrap}
.glass{background:rgba(255,255,255,0.72);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.6);border-radius:16px}
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem;margin-bottom:1.5rem}
.stat-card{padding:1.25rem;text-align:center}
.stat-card .val{font-size:1.75rem;font-weight:700;color:#0071e3}
.stat-card .label{font-size:0.8rem;color:#6b7280;margin-top:0.25rem}
.toolbar{display:flex;gap:0.75rem;margin-bottom:1.5rem;flex-wrap:wrap;align-items:center}
.search-box{flex:1;min-width:200px;padding:0.625rem 1rem;border:1px solid #e5e7eb;border-radius:10px;font-size:0.875rem;font-family:inherit;background:rgba(255,255,255,0.8);outline:none}
.search-box:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,0.1)}
select,button{font-family:inherit;font-size:0.8rem;padding:0.5rem 0.875rem;border-radius:10px;border:1px solid #e5e7eb;background:rgba(255,255,255,0.8);cursor:pointer;transition:all 0.15s}
select:focus,button:focus{outline:none;border-color:#3b82f6}
button:hover{background:#f3f4f6}
.btn-primary{background:#0071e3;color:#fff;border-color:#0071e3}
.btn-primary:hover{background:#005bb5}
.btn-sm{padding:0.35rem 0.625rem;font-size:0.75rem}
.btn-danger{color:#ef4444;border-color:#fca5a5}
.btn-danger:hover{background:#fef2f2}
.tag-filters{display:flex;gap:0.375rem;flex-wrap:wrap}
.tag-btn{padding:0.3rem 0.7rem;border-radius:20px;font-size:0.75rem;border:1px solid #e5e7eb;background:rgba(255,255,255,0.6);cursor:pointer;transition:all 0.15s}
.tag-btn:hover{background:rgba(59,130,246,0.08)}
.tag-btn.active{background:rgba(59,130,246,0.12);border-color:#93c5fd;color:#1d4ed8}
.contacts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:1rem;margin-bottom:2rem}
.contact-card{padding:1.25rem;cursor:pointer;transition:transform 0.2s,box-shadow 0.2s;position:relative}
.contact-card:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(0,0,0,0.06)}
.contact-card .top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:0.75rem}
.contact-card .name{font-weight:600;font-size:1rem}
.contact-card .company{font-size:0.85rem;color:#6b7280}
.contact-card .role{font-size:0.8rem;color:#9ca3af}
.contact-card .tags{display:flex;gap:0.3rem;flex-wrap:wrap;margin:0.5rem 0}
.contact-card .tag{padding:0.15rem 0.5rem;border-radius:12px;font-size:0.7rem;background:rgba(59,130,246,0.08);color:#3b82f6}
.contact-card .meta{display:flex;justify-content:space-between;align-items:center;font-size:0.75rem;color:#9ca3af;margin-top:0.75rem;padding-top:0.75rem;border-top:1px solid rgba(0,0,0,0.04)}
.strength-dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:0.35rem;vertical-align:middle}
.strength-strong{background:#22c55e}
.strength-warm{background:#f59e0b}
.strength-cold{background:#94a3b8}
.followup-badge{padding:0.2rem 0.5rem;border-radius:8px;font-size:0.7rem;font-weight:500}
.followup-overdue{background:rgba(239,68,68,0.1);color:#dc2626}
.followup-soon{background:rgba(245,158,11,0.1);color:#d97706}
.followup-ok{background:rgba(34,197,94,0.1);color:#16a34a}
/* Modal */
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.3);backdrop-filter:blur(4px);z-index:100;align-items:center;justify-content:center;padding:1rem}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:20px;padding:2rem;max-width:560px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.15)}
.modal h2{font-size:1.25rem;font-weight:700;margin-bottom:1.25rem}
.form-group{margin-bottom:1rem}
.form-group label{display:block;font-size:0.8rem;font-weight:500;color:#6b7280;margin-bottom:0.3rem}
.form-group input,.form-group textarea,.form-group select{width:100%;padding:0.5rem 0.75rem;border:1px solid #e5e7eb;border-radius:10px;font-size:0.85rem;font-family:inherit;outline:none}
.form-group input:focus,.form-group textarea:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,0.1)}
.form-group textarea{resize:vertical;min-height:60px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:0.75rem}
.modal-actions{display:flex;gap:0.5rem;justify-content:flex-end;margin-top:1.5rem}
/* Detail panel */
.detail-panel{display:none;position:fixed;top:0;right:0;bottom:0;width:480px;max-width:100vw;background:#fff;box-shadow:-8px 0 40px rgba(0,0,0,0.1);z-index:90;overflow-y:auto;padding:2rem}
.detail-panel.open{display:block}
.detail-panel h2{font-size:1.25rem;font-weight:700;margin-bottom:0.25rem}
.detail-panel .company-role{color:#6b7280;font-size:0.9rem;margin-bottom:1rem}
.detail-section{margin-bottom:1.5rem}
.detail-section h3{font-size:0.85rem;font-weight:600;color:#6b7280;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:0.5rem}
.detail-field{font-size:0.85rem;margin-bottom:0.35rem;color:#374151}
.detail-field span{color:#6b7280}
.interaction-item{padding:0.75rem;background:#f9fafb;border-radius:10px;margin-bottom:0.5rem;font-size:0.85rem}
.interaction-item .date{font-size:0.75rem;color:#9ca3af;margin-bottom:0.25rem}
.add-interaction{display:flex;gap:0.5rem;margin-top:0.75rem}
.add-interaction input{flex:1;padding:0.5rem 0.75rem;border:1px solid #e5e7eb;border-radius:10px;font-size:0.85rem;font-family:inherit}
.chart-container{position:relative;width:180px;height:180px;margin:0 auto}
.empty-state{text-align:center;padding:3rem;color:#9ca3af}
.close-btn{position:absolute;top:1rem;right:1rem;background:none;border:none;font-size:1.25rem;cursor:pointer;color:#9ca3af;padding:0.5rem}
.close-btn:hover{color:#1a1a2e}
@media(max-width:640px){.contacts-grid{grid-template-columns:1fr}.detail-panel{width:100%}.form-row{grid-template-columns:1fr}.stats-row{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-left">
      <h1>Network CRM</h1>
      <a href="index.html">&larr; Analytics</a>
    </div>
    <div class="header-actions">
      <button class="btn-primary" onclick="openAddModal()">+ Add Contact</button>
      <button onclick="exportJSON()">Export JSON</button>
      <button onclick="exportCSV()">Export CSV</button>
    </div>
  </div>

  <div class="stats-row">
    <div class="glass stat-card"><div class="val" id="statTotal">0</div><div class="label">Total Contacts</div></div>
    <div class="glass stat-card"><div class="val" id="statMonth">0</div><div class="label">Interactions This Month</div></div>
    <div class="glass stat-card"><div class="val" id="statOverdue">0</div><div class="label">Overdue Follow-ups</div></div>
    <div class="glass stat-card">
      <canvas id="catChart" width="140" height="140" style="margin:0 auto;display:block"></canvas>
      <div class="label" style="margin-top:0.5rem">By Category</div>
    </div>
  </div>

  <div class="toolbar">
    <input class="search-box" id="searchBox" type="text" placeholder="Search contacts...">
    <select id="sortSelect">
      <option value="name">Sort: Name</option>
      <option value="company">Sort: Company</option>
      <option value="lastInteraction">Sort: Last Interaction</option>
      <option value="followUp">Sort: Follow-up Date</option>
    </select>
  </div>
  <div class="tag-filters" id="tagFilters"></div>
  <div style="margin-bottom:1rem"></div>
  <div class="contacts-grid" id="contactsGrid"></div>
</div>

<!-- Add/Edit Modal -->
<div class="modal-overlay" id="contactModal">
  <div class="modal">
    <h2 id="modalTitle">Add Contact</h2>
    <input type="hidden" id="editId">
    <div class="form-row">
      <div class="form-group"><label>Name *</label><input id="fName" required></div>
      <div class="form-group"><label>Company</label><input id="fCompany"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Role</label><input id="fRole"></div>
      <div class="form-group"><label>Email</label><input id="fEmail" type="email"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>LinkedIn URL</label><input id="fLinkedin" type="url"></div>
      <div class="form-group"><label>How You Met</label><input id="fHowMet"></div>
    </div>
    <div class="form-group"><label>Tags (comma-separated)</label><input id="fTags" placeholder="Recruiter, AI/ML, Friend"></div>
    <div class="form-row">
      <div class="form-group"><label>Follow-up Date</label><input id="fFollowUp" type="date"></div>
      <div class="form-group"><label>Follow-up Note</label><input id="fFollowNote" placeholder="Check in re: role"></div>
    </div>
    <div class="form-group"><label>Notes</label><textarea id="fNotes" rows="3"></textarea></div>
    <div class="modal-actions">
      <button onclick="closeModal()">Cancel</button>
      <button class="btn-primary" onclick="saveContact()">Save</button>
    </div>
  </div>
</div>

<!-- Detail Panel -->
<div class="detail-panel" id="detailPanel">
  <button class="close-btn" onclick="closeDetail()">&times;</button>
  <div id="detailContent"></div>
</div>

<script>
const STORAGE_KEY = 'network-crm-contacts';
const PREDEFINED_TAGS = ['Recruiter','Architect','Engineering Leader','AI/ML','Consulting','Investor','Friend'];

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function today(){return new Date().toISOString().split('T')[0]}

/* ── Data ── */
function load(){
  try{return JSON.parse(localStorage.getItem(STORAGE_KEY))||[];}catch(e){return[];}
}
function save(contacts){localStorage.setItem(STORAGE_KEY,JSON.stringify(contacts))}

function seedData(){
  const contacts = load();
  if(contacts.length>0) return;
  const samples = [
    {id:uid(),name:'Priya Menon',company:'Deloitte',role:'Senior Recruiter',email:'priya.menon@deloitte.com',linkedin:'https://linkedin.com/in/priyamenon',howMet:'LinkedIn InMail',tags:['Recruiter','Consulting'],notes:'Specializes in cloud architecture roles. Very responsive.',followUp:'2026-05-05',followNote:'Follow up on principal architect role',interactions:[{date:'2026-04-15',note:'Initial call about cloud architect positions'},{date:'2026-04-22',note:'Sent updated resume, discussed Smara as portfolio piece'}]},
    {id:uid(),name:'James Okafor',company:'Revolut',role:'Engineering Director',email:'james.o@revolut.com',linkedin:'https://linkedin.com/in/jamesokafor',howMet:'QCon London 2025',tags:['Engineering Leader','AI/ML'],notes:'Building ML platform team. Interested in local-first architectures.',followUp:'2026-05-10',followNote:'Share Lumen architecture writeup',interactions:[{date:'2026-03-20',note:'Met at QCon, exchanged cards'},{date:'2026-04-10',note:'Coffee in Shoreditch, discussed hiring plans'}]},
    {id:uid(),name:'Ananya Sharma',company:'NeuralMesh AI',role:'Co-founder & CTO',email:'ananya@neuralmesh.ai',linkedin:'https://linkedin.com/in/ananyasharma-ai',howMet:'AI Tinkerers meetup',tags:['AI/ML','Investor'],notes:'Series A stage. Their agent orchestration platform is interesting. Potential Smara integration partner.',followUp:'2026-05-02',followNote:'Demo Smara MCP integration',interactions:[{date:'2026-04-01',note:'Met at AI Tinkerers, discussed agent memory'},{date:'2026-04-18',note:'Zoom call, she wants to try Smara for context management'},{date:'2026-04-25',note:'Sent Smara docs and API key for sandbox'}]},
    {id:uid(),name:'Rajiv Desai',company:'Deloitte (former)',role:'Senior Solutions Architect',email:'rajiv.desai@outlook.com',linkedin:'https://linkedin.com/in/rajivdesai',howMet:'Former colleague at Deloitte',tags:['Architect','Consulting','Friend'],notes:'Worked together on the Azure migration project. Now freelancing.',followUp:'2026-04-28',followNote:'Catch-up dinner, discuss collab on Scoper',interactions:[{date:'2026-02-14',note:'Caught up over Teams, he left Deloitte'},{date:'2026-03-30',note:'Shared Scoper early access, got great feedback'}]},
    {id:uid(),name:'Emily Chen',company:'Independent',role:'DevRel & Conference Speaker',email:'emily@emilychen.dev',linkedin:'https://linkedin.com/in/emilychendev',howMet:'KubeCon EU 2025',tags:['Engineering Leader','AI/ML','Friend'],notes:'Fantastic connector. Introduced me to 3 people at KubeCon. Runs the London Platform Engineering meetup.',followUp:'2026-05-15',followNote:'Submit talk proposal for her meetup',interactions:[{date:'2026-03-15',note:'KubeCon EU - panel on platform engineering'},{date:'2026-04-05',note:'She retweeted my Smara launch thread'}]}
  ];
  save(samples);
}

/* ── Relationship strength ── */
function getStrength(contact){
  if(!contact.interactions||contact.interactions.length===0) return 'cold';
  const dates = contact.interactions.map(i=>new Date(i.date)).sort((a,b)=>b-a);
  const daysSince = (Date.now()-dates[0])/(1000*60*60*24);
  const countLast90 = dates.filter(d=>(Date.now()-d)/(1000*60*60*24)<=90).length;
  if(daysSince<=21&&countLast90>=2) return 'strong';
  if(daysSince<=60) return 'warm';
  return 'cold';
}

function getFollowUpStatus(contact){
  if(!contact.followUp) return null;
  const diff = (new Date(contact.followUp)-new Date(today()))/(1000*60*60*24);
  if(diff<0) return 'overdue';
  if(diff<=7) return 'soon';
  return 'ok';
}

function getLastInteraction(contact){
  if(!contact.interactions||contact.interactions.length===0) return null;
  return contact.interactions.map(i=>i.date).sort().reverse()[0];
}

/* ── Render ── */
let activeTag = null;

function renderTagFilters(){
  const el = document.getElementById('tagFilters');
  const allTags = new Set(PREDEFINED_TAGS);
  load().forEach(c=>(c.tags||[]).forEach(t=>allTags.add(t)));
  el.innerHTML = `<button class="tag-btn ${!activeTag?'active':''}" onclick="filterTag(null)">All</button>`+
    [...allTags].map(t=>`<button class="tag-btn ${activeTag===t?'active':''}" onclick="filterTag('${t.replace(/'/g,"\\'")}')">${t}</button>`).join('');
}

function filterTag(tag){activeTag=tag;render();}

function getFiltered(){
  let contacts = load();
  const q = document.getElementById('searchBox').value.toLowerCase();
  if(q){
    contacts = contacts.filter(c=>{
      const blob = [c.name,c.company,c.role,c.email,c.howMet,c.notes,...(c.tags||[]),...(c.interactions||[]).map(i=>i.note)].join(' ').toLowerCase();
      return blob.includes(q);
    });
  }
  if(activeTag){
    contacts = contacts.filter(c=>(c.tags||[]).includes(activeTag));
  }
  const sort = document.getElementById('sortSelect').value;
  contacts.sort((a,b)=>{
    if(sort==='name') return (a.name||'').localeCompare(b.name||'');
    if(sort==='company') return (a.company||'').localeCompare(b.company||'');
    if(sort==='lastInteraction'){
      const la=getLastInteraction(a)||'', lb=getLastInteraction(b)||'';
      return lb.localeCompare(la);
    }
    if(sort==='followUp'){
      const fa=a.followUp||'9999', fb=b.followUp||'9999';
      return fa.localeCompare(fb);
    }
    return 0;
  });
  return contacts;
}

function render(){
  renderTagFilters();
  const contacts = getFiltered();
  const grid = document.getElementById('contactsGrid');
  if(contacts.length===0){
    grid.innerHTML='<div class="empty-state">No contacts found. Add your first contact above.</div>';
  } else {
    grid.innerHTML = contacts.map(c=>{
      const str = getStrength(c);
      const fu = getFollowUpStatus(c);
      const last = getLastInteraction(c);
      let fuHtml='';
      if(fu==='overdue') fuHtml=`<span class="followup-badge followup-overdue">Overdue</span>`;
      else if(fu==='soon') fuHtml=`<span class="followup-badge followup-soon">Due soon</span>`;
      else if(fu==='ok') fuHtml=`<span class="followup-badge followup-ok">${c.followUp}</span>`;
      return `<div class="glass contact-card" onclick="openDetail('${c.id}')">
        <div class="top">
          <div>
            <div class="name"><span class="strength-dot strength-${str}"></span>${esc(c.name)}</div>
            <div class="company">${esc(c.company||'')}</div>
            <div class="role">${esc(c.role||'')}</div>
          </div>
          ${fuHtml}
        </div>
        <div class="tags">${(c.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
        <div class="meta">
          <span>${last?'Last: '+last:'No interactions'}</span>
          <span>${(c.interactions||[]).length} interaction${(c.interactions||[]).length!==1?'s':''}</span>
        </div>
      </div>`;
    }).join('');
  }
  updateStats();
}

function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}

/* ── Stats & Chart ── */
function updateStats(){
  const all = load();
  document.getElementById('statTotal').textContent=all.length;
  const now=new Date(), y=now.getFullYear(), m=now.getMonth();
  let monthCount=0;
  all.forEach(c=>(c.interactions||[]).forEach(i=>{const d=new Date(i.date);if(d.getFullYear()===y&&d.getMonth()===m)monthCount++;}));
  document.getElementById('statMonth').textContent=monthCount;
  const overdue=all.filter(c=>getFollowUpStatus(c)==='overdue').length;
  document.getElementById('statOverdue').textContent=overdue;
  drawCategoryChart(all);
}

function drawCategoryChart(contacts){
  const canvas=document.getElementById('catChart');
  const ctx=canvas.getContext('2d');
  const dpr=window.devicePixelRatio||1;
  canvas.width=140*dpr;canvas.height=140*dpr;
  ctx.scale(dpr,dpr);
  const counts={};
  contacts.forEach(c=>(c.tags||[]).forEach(t=>{counts[t]=(counts[t]||0)+1;}));
  const entries=Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,8);
  if(entries.length===0){ctx.fillStyle='#e5e7eb';ctx.beginPath();ctx.arc(70,70,55,0,Math.PI*2);ctx.fill();return;}
  const total=entries.reduce((s,e)=>s+e[1],0);
  const colors=['#3b82f6','#8b5cf6','#10b981','#f59e0b','#ef4444','#ec4899','#6366f1','#14b8a6'];
  let angle=-Math.PI/2;
  entries.forEach(([tag,count],i)=>{
    const slice=2*Math.PI*(count/total);
    ctx.beginPath();ctx.moveTo(70,70);ctx.arc(70,70,55,angle,angle+slice);ctx.closePath();
    ctx.fillStyle=colors[i%colors.length];ctx.fill();
    // label
    const mid=angle+slice/2;
    const lx=70+35*Math.cos(mid),ly=70+35*Math.sin(mid);
    ctx.fillStyle='#fff';ctx.font='bold 9px Inter,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    if(slice>0.3) ctx.fillText(tag.length>8?tag.slice(0,7)+'..':tag,lx,ly);
    angle+=slice;
  });
  // donut hole
  ctx.beginPath();ctx.arc(70,70,30,0,Math.PI*2);ctx.fillStyle='#f8f9fc';ctx.fill();
  ctx.fillStyle='#1a1a2e';ctx.font='bold 16px Inter,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(contacts.length,70,66);
  ctx.fillStyle='#9ca3af';ctx.font='9px Inter,sans-serif';
  ctx.fillText('contacts',70,80);
}

/* ── Modal ── */
function openAddModal(editContact){
  const m=document.getElementById('contactModal');
  m.classList.add('open');
  if(editContact){
    document.getElementById('modalTitle').textContent='Edit Contact';
    document.getElementById('editId').value=editContact.id;
    document.getElementById('fName').value=editContact.name||'';
    document.getElementById('fCompany').value=editContact.company||'';
    document.getElementById('fRole').value=editContact.role||'';
    document.getElementById('fEmail').value=editContact.email||'';
    document.getElementById('fLinkedin').value=editContact.linkedin||'';
    document.getElementById('fHowMet').value=editContact.howMet||'';
    document.getElementById('fTags').value=(editContact.tags||[]).join(', ');
    document.getElementById('fFollowUp').value=editContact.followUp||'';
    document.getElementById('fFollowNote').value=editContact.followNote||'';
    document.getElementById('fNotes').value=editContact.notes||'';
  } else {
    document.getElementById('modalTitle').textContent='Add Contact';
    document.getElementById('editId').value='';
    ['fName','fCompany','fRole','fEmail','fLinkedin','fHowMet','fTags','fFollowUp','fFollowNote','fNotes'].forEach(id=>document.getElementById(id).value='');
  }
}
function closeModal(){document.getElementById('contactModal').classList.remove('open');}

function saveContact(){
  const name=document.getElementById('fName').value.trim();
  if(!name){alert('Name is required.');return;}
  const contacts=load();
  const editId=document.getElementById('editId').value;
  const data={
    name,
    company:document.getElementById('fCompany').value.trim(),
    role:document.getElementById('fRole').value.trim(),
    email:document.getElementById('fEmail').value.trim(),
    linkedin:document.getElementById('fLinkedin').value.trim(),
    howMet:document.getElementById('fHowMet').value.trim(),
    tags:document.getElementById('fTags').value.split(',').map(t=>t.trim()).filter(Boolean),
    followUp:document.getElementById('fFollowUp').value,
    followNote:document.getElementById('fFollowNote').value.trim(),
    notes:document.getElementById('fNotes').value.trim()
  };
  if(editId){
    const idx=contacts.findIndex(c=>c.id===editId);
    if(idx>=0){contacts[idx]={...contacts[idx],...data};}
  } else {
    data.id=uid();
    data.interactions=[];
    contacts.push(data);
  }
  save(contacts);
  closeModal();
  render();
}

/* ── Detail Panel ── */
function openDetail(id){
  const contacts=load();
  const c=contacts.find(x=>x.id===id);
  if(!c) return;
  const panel=document.getElementById('detailPanel');
  const str=getStrength(c);
  const strLabel={strong:'Strong',warm:'Warm',cold:'Cold'}[str];
  const fu=getFollowUpStatus(c);
  let fuHtml='';
  if(c.followUp){
    const cls=fu==='overdue'?'followup-overdue':fu==='soon'?'followup-soon':'followup-ok';
    fuHtml=`<span class="followup-badge ${cls}">${fu==='overdue'?'OVERDUE - ':fu==='soon'?'Due soon - ':''}${c.followUp}</span>`;
    if(c.followNote) fuHtml+=` <span style="font-size:0.8rem;color:#6b7280">${esc(c.followNote)}</span>`;
  }
  document.getElementById('detailContent').innerHTML=`
    <h2><span class="strength-dot strength-${str}"></span>${esc(c.name)}</h2>
    <div class="company-role">${esc(c.company||'')}${c.company&&c.role?' &middot; ':''}${esc(c.role||'')}</div>
    <div style="margin-bottom:1rem">${fuHtml}</div>
    <div class="detail-section">
      <h3>Details</h3>
      ${c.email?`<div class="detail-field"><span>Email:</span> <a href="mailto:${esc(c.email)}">${esc(c.email)}</a></div>`:''}
      ${c.linkedin?`<div class="detail-field"><span>LinkedIn:</span> <a href="${esc(c.linkedin)}" target="_blank">Profile</a></div>`:''}
      ${c.howMet?`<div class="detail-field"><span>How met:</span> ${esc(c.howMet)}</div>`:''}
      <div class="detail-field"><span>Relationship:</span> <span class="strength-dot strength-${str}"></span>${strLabel}</div>
      <div class="detail-field"><span>Tags:</span> ${(c.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join(' ')}</div>
      ${c.notes?`<div class="detail-field" style="margin-top:0.5rem"><span>Notes:</span> ${esc(c.notes)}</div>`:''}
    </div>
    <div class="detail-section">
      <h3>Follow-up</h3>
      <div style="display:flex;gap:0.5rem;align-items:center;margin-bottom:0.5rem">
        <input type="date" id="detailFollowDate" value="${c.followUp||''}" style="padding:0.4rem 0.6rem;border:1px solid #e5e7eb;border-radius:8px;font-family:inherit;font-size:0.85rem">
        <input id="detailFollowNote" value="${esc(c.followNote||'')}" placeholder="Follow-up note" style="flex:1;padding:0.4rem 0.6rem;border:1px solid #e5e7eb;border-radius:8px;font-family:inherit;font-size:0.85rem">
        <button class="btn-sm btn-primary" onclick="saveFollowUp('${c.id}')">Set</button>
      </div>
    </div>
    <div class="detail-section">
      <h3>Interactions (${(c.interactions||[]).length})</h3>
      <div id="interactionList">${(c.interactions||[]).sort((a,b)=>b.date.localeCompare(a.date)).map(i=>`
        <div class="interaction-item"><div class="date">${i.date}</div>${esc(i.note)}</div>
      `).join('')}</div>
      <div class="add-interaction">
        <input type="date" id="intDate" value="${today()}" style="width:140px;padding:0.4rem 0.6rem;border:1px solid #e5e7eb;border-radius:8px;font-family:inherit;font-size:0.85rem">
        <input id="intNote" placeholder="What happened?" style="flex:1;padding:0.4rem 0.6rem;border:1px solid #e5e7eb;border-radius:8px;font-family:inherit;font-size:0.85rem">
        <button class="btn-sm btn-primary" onclick="addInteraction('${c.id}')">Add</button>
      </div>
    </div>
    <div style="display:flex;gap:0.5rem;margin-top:2rem;border-top:1px solid #e5e7eb;padding-top:1rem">
      <button onclick="openAddModal(load().find(c=>c.id==='${c.id}'));closeDetail()">Edit</button>
      <button class="btn-danger" onclick="if(confirm('Delete this contact?')){deleteContact('${c.id}')}">Delete</button>
    </div>
  `;
  panel.classList.add('open');
}
function closeDetail(){document.getElementById('detailPanel').classList.remove('open');}

function addInteraction(id){
  const date=document.getElementById('intDate').value;
  const note=document.getElementById('intNote').value.trim();
  if(!note) return;
  const contacts=load();
  const c=contacts.find(x=>x.id===id);
  if(!c) return;
  if(!c.interactions) c.interactions=[];
  c.interactions.push({date:date||today(),note});
  save(contacts);
  openDetail(id);
  render();
}

function saveFollowUp(id){
  const contacts=load();
  const c=contacts.find(x=>x.id===id);
  if(!c) return;
  c.followUp=document.getElementById('detailFollowDate').value;
  c.followNote=document.getElementById('detailFollowNote').value.trim();
  save(contacts);
  openDetail(id);
  render();
}

function deleteContact(id){
  const contacts=load().filter(c=>c.id!==id);
  save(contacts);
  closeDetail();
  render();
}

/* ── Export ── */
function exportJSON(){
  const blob=new Blob([JSON.stringify(load(),null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='network-crm-backup.json';a.click();
}

function exportCSV(){
  const contacts=load();
  const headers=['Name','Company','Role','Email','LinkedIn','How Met','Tags','Follow-up Date','Follow-up Note','Notes','Last Interaction','Total Interactions','Strength'];
  const rows=contacts.map(c=>[
    c.name,c.company,c.role,c.email,c.linkedin,c.howMet,(c.tags||[]).join(';'),
    c.followUp||'',c.followNote||'',c.notes,getLastInteraction(c)||'',(c.interactions||[]).length,getStrength(c)
  ].map(v=>'"'+String(v||'').replace(/"/g,'""')+'"'));
  const csv=[headers.join(','),...rows.map(r=>r.join(','))].join('\n');
  const blob=new Blob([csv],{type:'text/csv'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='network-crm.csv';a.click();
}

/* ── Events ── */
document.getElementById('searchBox').addEventListener('input',render);
document.getElementById('sortSelect').addEventListener('change',render);
document.getElementById('contactModal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeDetail();}});

/* ── Init ── */
seedData();
render();
</script>
</body>
