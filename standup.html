<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: #f8f9fc;
  color: #1a1a2e;
  min-height: 100vh;
  padding: 1.5rem;
}
.container { max-width: 820px; margin: 0 auto; }

/* Header */
.top-bar {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 1.5rem; flex-wrap: wrap; gap: 0.75rem;
}
.top-bar h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; }
.top-bar .actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }

/* Glass card */
.glass {
  background: rgba(255,255,255,0.72);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.6);
  border-radius: 16px;
  padding: 1.5rem;
  margin-bottom: 1rem;
}

/* Date nav */
.date-nav {
  display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1.25rem;
}
.date-nav button {
  background: rgba(255,255,255,0.8); border: 1px solid #e5e7eb; border-radius: 8px;
  padding: 0.4rem 0.75rem; cursor: pointer; font-family: inherit; font-size: 0.85rem;
  transition: background 0.15s;
}
.date-nav button:hover { background: #e5e7eb; }
.date-display { font-size: 1.1rem; font-weight: 600; }

/* Stats row */
.stats-row {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(140px,1fr));
  gap: 0.75rem; margin-bottom: 1.25rem;
}
.stat-card {
  background: rgba(255,255,255,0.72);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.6);
  border-radius: 12px; padding: 1rem; text-align: center;
}
.stat-card .val { font-size: 1.5rem; font-weight: 700; }
.stat-card .label { font-size: 0.75rem; color: #6b7280; margin-top: 0.25rem; }

/* Section */
.section-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 0.75rem;
}
.section-header h2 { font-size: 1rem; font-weight: 600; display: flex; align-items: center; gap: 0.5rem; }
.section-header .badge {
  background: #e5e7eb; border-radius: 999px; padding: 0.15rem 0.5rem;
  font-size: 0.7rem; font-weight: 600; color: #6b7280;
}

/* Items */
.item-list { list-style: none; display: flex; flex-direction: column; gap: 0.5rem; }
.item-row {
  display: flex; align-items: center; gap: 0.5rem;
  background: rgba(255,255,255,0.5); border: 1px solid #f0f0f3;
  border-radius: 10px; padding: 0.5rem 0.75rem;
  transition: box-shadow 0.15s;
}
.item-row:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
.item-row .bullet { color: #9ca3af; font-size: 0.6rem; flex-shrink: 0; }
.item-row select {
  font-family: inherit; font-size: 0.7rem; font-weight: 600;
  border: 1px solid #e5e7eb; border-radius: 6px; padding: 0.2rem 0.35rem;
  background: #f3f4f6; color: #374151; cursor: pointer; flex-shrink: 0;
}
.item-row input[type="text"] {
  flex: 1; border: none; background: transparent; font-family: inherit;
  font-size: 0.875rem; outline: none; color: #1a1a2e;
}
.item-row input[type="text"]::placeholder { color: #c0c4cc; }
.item-row .remove-btn {
  background: none; border: none; cursor: pointer; color: #d1d5db;
  font-size: 1rem; padding: 0 0.25rem; transition: color 0.15s;
}
.item-row .remove-btn:hover { color: #ef4444; }

.add-btn {
  background: none; border: 1px dashed #d1d5db; border-radius: 8px;
  padding: 0.5rem; width: 100%; cursor: pointer; font-family: inherit;
  font-size: 0.8rem; color: #9ca3af; margin-top: 0.5rem;
  transition: border-color 0.15s, color 0.15s;
}
.add-btn:hover { border-color: #3b82f6; color: #3b82f6; }

/* Action buttons */
.btn {
  font-family: inherit; font-size: 0.8rem; font-weight: 500;
  border: 1px solid #e5e7eb; border-radius: 8px; padding: 0.5rem 1rem;
  cursor: pointer; transition: all 0.15s; background: #fff; color: #374151;
}
.btn:hover { background: #f3f4f6; }
.btn-primary { background: #1a1a2e; color: #fff; border-color: #1a1a2e; }
.btn-primary:hover { background: #2d2d4e; }
.btn-success { background: #10b981; color: #fff; border-color: #10b981; }
.btn-success:hover { background: #059669; }
.btn-copy-done { background: #22c55e !important; border-color: #22c55e !important; }

/* Templates */
.template-bar {
  display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 1rem;
}
.template-chip {
  font-family: inherit; font-size: 0.72rem; font-weight: 500;
  background: rgba(59,130,246,0.08); border: 1px solid rgba(59,130,246,0.2);
  border-radius: 999px; padding: 0.3rem 0.75rem; cursor: pointer;
  color: #3b82f6; transition: all 0.15s;
}
.template-chip:hover { background: rgba(59,130,246,0.15); }

/* History */
.history-search {
  width: 100%; font-family: inherit; font-size: 0.85rem;
  border: 1px solid #e5e7eb; border-radius: 8px; padding: 0.6rem 0.75rem;
  background: rgba(255,255,255,0.6); margin-bottom: 0.75rem; outline: none;
}
.history-search:focus { border-color: #3b82f6; }
.history-list { max-height: 360px; overflow-y: auto; }
.history-item {
  padding: 0.75rem; border-radius: 10px; cursor: pointer;
  transition: background 0.15s; border-bottom: 1px solid #f0f0f3;
}
.history-item:hover { background: rgba(59,130,246,0.04); }
.history-item .hist-date { font-weight: 600; font-size: 0.85rem; }
.history-item .hist-preview { font-size: 0.75rem; color: #6b7280; margin-top: 0.2rem; }
.history-item.active { background: rgba(59,130,246,0.08); }

/* Tag colors */
.tag-cibc { background: #dbeafe; color: #1e40af; }
.tag-smara { background: #d1fae5; color: #065f46; }
.tag-lumen { background: #ede9fe; color: #5b21b6; }
.tag-scoper { background: #fef3c7; color: #92400e; }
.tag-pjtales { background: #fce7f3; color: #9d174d; }
.tag-personal { background: #f3f4f6; color: #374151; }

/* Tabs */
.tab-bar { display: flex; gap: 0; margin-bottom: 1rem; }
.tab {
  font-family: inherit; font-size: 0.85rem; font-weight: 500;
  background: transparent; border: 1px solid #e5e7eb; padding: 0.5rem 1.25rem;
  cursor: pointer; color: #6b7280; transition: all 0.15s;
}
.tab:first-child { border-radius: 8px 0 0 8px; }
.tab:last-child { border-radius: 0 8px 8px 0; }
.tab.active { background: #1a1a2e; color: #fff; border-color: #1a1a2e; }

/* Views */
.view { display: none; }
.view.active { display: block; }

/* Responsive */
@media (max-width: 600px) {
  body { padding: 1rem; }
  .top-bar { flex-direction: column; align-items: flex-start; }
  .stats-row { grid-template-columns: repeat(2, 1fr); }
}

/* Carried badge */
.carried-badge {
  font-size: 0.6rem; background: #fef3c7; color: #92400e;
  border-radius: 4px; padding: 0.1rem 0.35rem; font-weight: 600; flex-shrink: 0;
}

/* Delete history */
.delete-hist {
  background: none; border: none; color: #d1d5db; cursor: pointer;
  font-size: 0.8rem; float: right; transition: color 0.15s;
}
.delete-hist:hover { color: #ef4444; }

.back-link {
  display: inline-flex; align-items: center; gap: 0.35rem;
  color: #6b7280; text-decoration: none; font-size: 0.8rem; font-weight: 500;
  margin-bottom: 1rem; transition: color 0.15s;
}
.back-link:hover { color: #1a1a2e; }
</style>
</head>

  <div class="top-bar">
    <h1>Daily Standup</h1>
    <div class="actions">
      <button class="btn btn-primary" onclick="copyFormatted()">Copy for Slack</button>
      <button class="btn" onclick="exportJSON()">Export</button>

  <div class="tab-bar">

      <div class="stat-card">
        <div class="val" id="statStreak">0</div>
        <div class="label">Day streak</div>
      </div>
      <div class="stat-card">
        <div class="val" id="statProject">--</div>
        <div class="label">Top project</div>

    <!-- Templates -->
    <div class="template-bar">
      <button class="template-chip" onclick="applyTemplate('standup')">Team standup</button>
      <button class="template-chip" onclick="applyTemplate('sprint')">Sprint review</button>
      <button class="template-chip" onclick="applyTemplate('1on1')">1:1 prep</button>
      <button class="template-chip" onclick="applyTemplate('eod')">End of day</button>
      <button class="template-chip" onclick="applyTemplate('planning')">Sprint planning</button>
    </div>

    <!-- Yesterday -->
    <div class="glass">
      <div class="section-header">
        <h2><span style="color:#10b981">&#9745;</span> Yesterday <span class="badge" id="yesterdayCount">0</span></h2>
      </div>
      <ul class="item-list" id="yesterdayList"></ul>
      <button class="add-btn" onclick="addItem('yesterday')">+ Add item</button>
    </div>

    <!-- Today -->
    <div class="glass">
      <div class="section-header">
        <h2><span style="color:#3b82f6">&#9744;</span> Today <span class="badge" id="todayCount">0</span></h2>
      </div>
      <ul class="item-list" id="todayList"></ul>
      <button class="add-btn" onclick="addItem('today')">+ Add item</button>
    </div>

    <!-- Blockers -->
    <div class="glass">
      <div class="section-header">
        <h2><span style="color:#ef4444">&#9888;</span> Blockers <span class="badge" id="blockersCount">0</span></h2>
      </div>
      <ul class="item-list" id="blockersList"></ul>
      <button class="add-btn" onclick="addItem('blockers')">+ Add item</button>
    </div>
  </div>

  <!-- History View -->
  <div id="view-history" class="view">
    <input type="text" class="history-search" placeholder="Search across all standups..." oninput="renderHistory(this.value)">
    <div class="history-list" id="historyList"></div>
  </div>
</div>

<input type="file" id="importInput" accept=".json" style="display:none" onchange="handleImport(event)">

<script>
const STORAGE_KEY = 'standup_data';
const PROJECTS = ['CIBC','Smara','Lumen','Scoper','PJ Tales','Personal'];
const TEMPLATES = {
  standup: {
    yesterday: [{text:'Team standup sync',project:'CIBC'}],
    today: [{text:'Team standup sync',project:'CIBC'}],
    blockers: []
  },
  sprint: {
    yesterday: [{text:'Sprint demo prep',project:'CIBC'},{text:'Updated sprint board',project:'CIBC'}],
    today: [{text:'Sprint review meeting',project:'CIBC'},{text:'Retro action items',project:'CIBC'}],
    blockers: []
  },
  '1on1': {
    yesterday: [{text:'Prepared talking points',project:'CIBC'}],
    today: [{text:'1:1 with manager',project:'CIBC'},{text:'Follow up on action items',project:'CIBC'}],
    blockers: []
  },
  eod: {
    yesterday: [],
    today: [{text:'Wrap up open PRs',project:'CIBC'},{text:'Update Jira tickets',project:'CIBC'},{text:'Push branch for review',project:'CIBC'}],
    blockers: []
  },
  planning: {
    yesterday: [{text:'Groomed backlog items',project:'CIBC'}],
    today: [{text:'Sprint planning meeting',project:'CIBC'},{text:'Story point estimation',project:'CIBC'},{text:'Update capacity plan',project:'CIBC'}],
    blockers: []
  }
};

let currentDate = new Date();
let allData = {};

function dateKey(d) {
  return d.toISOString().slice(0,10);
}

function formatDate(d) {
  return d.toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
}

function load() {
  try { allData = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch { allData = {}; }
}

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(allData));
}

function getDay(key) {
  if (!allData[key]) allData[key] = { yesterday:[], today:[], blockers:[] };
  return allData[key];
}

function changeDate(delta) {
  currentDate.setDate(currentDate.getDate() + delta);
  render();
}

function goToday() {
  currentDate = new Date();
  render();
}

function switchView(v) {
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', (v==='editor'?i===0:i===1)));
  document.getElementById('view-editor').classList.toggle('active', v==='editor');
  document.getElementById('view-history').classList.toggle('active', v==='history');
  if (v==='history') renderHistory('');
}

function projectSlug(p) { return p.toLowerCase().replace(/\s+/g,''); }

function renderItemRow(section, idx, item) {
  const li = document.createElement('li');
  li.className = 'item-row';
  li.innerHTML = `
    <span class="bullet">&#9679;</span>
    <select onchange="updateItem('${section}',${idx},'project',this.value)" class="tag-${projectSlug(item.project||'Personal')}">
      ${PROJECTS.map(p=>`<option value="${p}" ${p===item.project?'selected':''}>${p}</option>`).join('')}
    </select>
    ${item.carried ? '<span class="carried-badge">carried</span>' : ''}
    <input type="text" value="${(item.text||'').replace(/"/g,'&quot;')}" placeholder="What did you do?"
      oninput="updateItem('${section}',${idx},'text',this.value)"
      onkeydown="handleKey(event,'${section}',${idx})">
    <button class="remove-btn" onclick="removeItem('${section}',${idx})">&times;</button>
  `;
  // Update tag class on project change
  const sel = li.querySelector('select');
  sel.addEventListener('change', function() {
    this.className = 'tag-' + projectSlug(this.value);
  });
  return li;
}

function render() {
  const key = dateKey(currentDate);
  document.getElementById('dateDisplay').textContent = formatDate(currentDate);

  // Auto-carry: if today's standup has no yesterday items and prev day had today items
  const day = getDay(key);
  if (day.yesterday.length === 0 && day.today.length === 0 && day.blockers.length === 0) {
    const prev = new Date(currentDate);
    prev.setDate(prev.getDate() - 1);
    const prevDay = allData[dateKey(prev)];
    if (prevDay && prevDay.today && prevDay.today.length > 0) {
      day.yesterday = prevDay.today.map(i => ({...i, carried: true}));
      save();
    }
  }

  ['yesterday','today','blockers'].forEach(section => {
    const list = document.getElementById(section + 'List');
    list.innerHTML = '';
    (day[section]||[]).forEach((item, idx) => {
      list.appendChild(renderItemRow(section, idx, item));
    });
    document.getElementById(section + 'Count').textContent = (day[section]||[]).length;
  });

  updateStats();
}

function addItem(section, text='', project='CIBC') {
  const key = dateKey(currentDate);
  const day = getDay(key);
  day[section].push({text, project});
  save();
  render();
  // Focus new input
  const list = document.getElementById(section + 'List');
  const inputs = list.querySelectorAll('input[type="text"]');
  if (inputs.length) inputs[inputs.length-1].focus();
}

function removeItem(section, idx) {
  const day = getDay(dateKey(currentDate));
  day[section].splice(idx, 1);
  save();
  render();
}

function updateItem(section, idx, field, value) {
  const day = getDay(dateKey(currentDate));
  if (day[section][idx]) {
    day[section][idx][field] = value;
    if (field === 'text' && day[section][idx].carried) delete day[section][idx].carried;
    save();
    // Update count badge only, avoid full re-render on text edit
    document.getElementById(section + 'Count').textContent = day[section].length;
  }
}

function handleKey(e, section, idx) {
  if (e.key === 'Enter') {
    e.preventDefault();
    addItem(section);
  } else if (e.key === 'Backspace' && e.target.value === '') {
    e.preventDefault();
    removeItem(section, idx);
  }
}

function applyTemplate(name) {
  const tpl = TEMPLATES[name];
  if (!tpl) return;
  const key = dateKey(currentDate);
  const day = getDay(key);
  ['yesterday','today','blockers'].forEach(s => {
    tpl[s].forEach(item => {
      if (!day[s].some(existing => existing.text === item.text)) {
        day[s].push({...item});
      }
    });
  });
  save();
  render();
}

function copyFormatted() {
  const key = dateKey(currentDate);
  const day = getDay(key);
  const d = currentDate.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});

  const fmt = (items) => {
    if (!items || items.length === 0) return '  \u2022 None';
    return items.map(i => `  \u2022 [${i.project||'Personal'}] ${i.text||'(empty)'}`).join('\n');
  };

  const text = `\uD83D\uDCC5 ${d}\n\n\u2705 Yesterday:\n${fmt(day.yesterday)}\n\n\uD83D\uDCCB Today:\n${fmt(day.today)}\n\n\uD83D\uDEAB Blockers:\n${fmt(day.blockers)}`;

  navigator.clipboard.writeText(text).then(() => {
    const btn = document.querySelector('.btn-primary');
    const orig = btn.textContent;
    btn.textContent = 'Copied!';
    btn.classList.add('btn-copy-done');
    setTimeout(() => { btn.textContent = orig; btn.classList.remove('btn-copy-done'); }, 1500);
  });
}

function updateStats() {
  const keys = Object.keys(allData).sort();
  // This week
  const now = new Date();
  const weekStart = new Date(now);
  weekStart.setDate(now.getDate() - now.getDay());
  const weekKey = dateKey(weekStart);
  const thisWeek = keys.filter(k => k >= weekKey).length;
  document.getElementById('statWeek').textContent = thisWeek;

  // Total items all time
  let totalItems = 0;
  let projectCount = {};
  keys.forEach(k => {
    const d = allData[k];
    ['yesterday','today','blockers'].forEach(s => {
      (d[s]||[]).forEach(item => {
        if (item.text) {
          totalItems++;
          const p = item.project || 'Personal';
          projectCount[p] = (projectCount[p]||0) + 1;
        }
      });
    });
  });
  document.getElementById('statItems').textContent = totalItems;

  // Top project
  let topP = '--';
  let topC = 0;
  Object.entries(projectCount).forEach(([p,c]) => { if (c > topC) { topP = p; topC = c; }});
  document.getElementById('statProject').textContent = topP;

  // Streak
  let streak = 0;
  const today = dateKey(new Date());
  let check = new Date();
  // If today hasn't been filled, start from yesterday
  if (!allData[today] || (allData[today].yesterday.length===0 && allData[today].today.length===0)) {
    check.setDate(check.getDate() - 1);
  }
  while (true) {
    const ck = dateKey(check);
    const d = allData[ck];
    if (d && (d.yesterday.length > 0 || d.today.length > 0)) {
      streak++;
      check.setDate(check.getDate() - 1);
    } else break;
  }
  document.getElementById('statStreak').textContent = streak;
}

function renderHistory(query) {
  const list = document.getElementById('historyList');
  list.innerHTML = '';
  const q = (query||'').toLowerCase();
  const keys = Object.keys(allData).sort().reverse();

  keys.forEach(key => {
    const d = allData[key];
    const allItems = [...(d.yesterday||[]),...(d.today||[]),...(d.blockers||[])];
    const texts = allItems.map(i=>`[${i.project}] ${i.text}`).join(' ').toLowerCase();
    if (q && !texts.includes(q) && !key.includes(q)) return;

    const preview = allItems.filter(i=>i.text).slice(0,3).map(i=>`[${i.project}] ${i.text}`).join(' | ');
    const dt = new Date(key + 'T12:00:00');

    const div = document.createElement('div');
    div.className = 'history-item' + (key === dateKey(currentDate) ? ' active' : '');
    div.innerHTML = `
      <button class="delete-hist" onclick="event.stopPropagation();deleteDay('${key}')" title="Delete">&times;</button>
      <div class="hist-date">${dt.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'})}</div>
      <div class="hist-preview">${preview || '(empty)'} &mdash; ${allItems.length} items</div>
    `;
    div.addEventListener('click', () => {
      currentDate = new Date(key + 'T12:00:00');
      switchView('editor');
      render();
    });
    list.appendChild(div);
  });

  if (list.children.length === 0) {
    list.innerHTML = '<div style="text-align:center;color:#9ca3af;padding:2rem">No standups found</div>';
  }
}

function deleteDay(key) {
  if (!confirm('Delete standup for ' + key + '?')) return;
  delete allData[key];
  save();
  renderHistory(document.querySelector('.history-search')?.value || '');
  if (key === dateKey(currentDate)) render();
}

function exportJSON() {
  const blob = new Blob([JSON.stringify(allData, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `standup-export-${dateKey(new Date())}.json`;
  a.click();
}

function importJSON() {
  document.getElementById('importInput').click();
}

function handleImport(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    try {
      const imported = JSON.parse(ev.target.result);
      Object.assign(allData, imported);
      save();
      render();
      alert('Imported ' + Object.keys(imported).length + ' days');
    } catch { alert('Invalid JSON file'); }
  };
  reader.readAsText(file);
  e.target.value = '';
}

// Init
load();
render();
</script>
<script src="/_lumen-footer.js" defer></script>
</body>
