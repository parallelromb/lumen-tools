<script>
// Default services — all CORS-friendly so they show green out of the box.
// To monitor your own services, click "+ Add Service". CORS-blocked URLs
// (most non-status endpoints) will show as amber (CORS) — that's usually
// fine, it still tells you the service is reachable.
const DEFAULT_SERVICES = [
  { id: 'github-api',    name: 'GitHub API',    url: 'https://api.github.com/zen' },
  { id: 'github-status', name: 'GitHub Status', url: 'https://www.githubstatus.com/api/v2/status.json' },
  { id: 'ipify',         name: 'ipify',         url: 'https://api.ipify.org?format=json' },
];

const STORAGE_KEY = 'lumen-health-services';
const HISTORY_KEY = 'lumen-health-history';
const CUSTOM_KEY = 'lumen-health-custom';

let services = [];
let history = {};  // { serviceId: [ { ts, status, responseTime } ] }
let selectedService = null;
let autoRefreshInterval = null;
let chart = null;

function loadState() {
  const custom = JSON.parse(localStorage.getItem(CUSTOM_KEY) || '[]');
  services = [...DEFAULT_SERVICES, ...custom];
  history = JSON.parse(localStorage.getItem(HISTORY_KEY) || '{}');
  // Initialize history for any service without it
  services.forEach(s => {
    if (!history[s.id]) history[s.id] = [];
  });
}

function saveHistory() {
  // Keep last 100 per service
  for (const id in history) {
    if (history[id].length > 100) {
      history[id] = history[id].slice(-100);
    }
  }
  localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
}

function saveCustom() {
  const defaultIds = DEFAULT_SERVICES.map(s => s.id);
  const custom = services.filter(s => !defaultIds.includes(s.id));
  localStorage.setItem(CUSTOM_KEY, JSON.stringify(custom));
}

async function checkService(service) {
  const start = performance.now();
  let status = 'unknown';
  let responseTime = null;

  try {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 8000);
    const resp = await fetch(service.url, {
      mode: 'cors',
      signal: controller.signal,
      cache: 'no-store',
    });
    clearTimeout(timeout);
    responseTime = Math.round(performance.now() - start);
    status = resp.ok ? 'up' : 'down';
  } catch (e) {
    responseTime = Math.round(performance.now() - start);
    if (e.name === 'AbortError') {
      status = 'down';
    } else if (e.message && (e.message.includes('Failed to fetch') || e.message.includes('NetworkError') || e.message.includes('CORS'))) {
      // Could be CORS or actually down - if response time is very fast, likely CORS
      status = responseTime < 2000 ? 'cors' : 'down';
    } else {
      status = 'down';
    }
  }

  const entry = { ts: Date.now(), status, responseTime };
  if (!history[service.id]) history[service.id] = [];
  history[service.id].push(entry);

  return { ...service, lastCheck: entry };
}

async function checkAll() {
  const grid = document.getElementById('servicesGrid');
  // Set all to checking state
  document.querySelectorAll('.status-dot').forEach(d => d.className = 'status-dot unknown');

  const results = await Promise.allSettled(services.map(s => checkService(s)));
  saveHistory();

  // Check for newly down services
  results.forEach(r => {
    if (r.status === 'fulfilled') {
      const svc = r.value;
      if (svc.lastCheck.status === 'down') {
        const hist = history[svc.id];
        if (hist.length >= 2 && hist[hist.length - 2].status !== 'down') {
          showNotification(`${svc.name} is DOWN!`);
        }
      }
    }
  });

  renderCards();
  updateSummary();
  if (selectedService) updateChart(selectedService);
  document.getElementById('lastCheckTime').textContent = new Date().toLocaleTimeString();
}

function getLastCheck(serviceId) {
  const hist = history[serviceId];
  if (!hist || hist.length === 0) return null;
  return hist[hist.length - 1];
}

function getUptime24h(serviceId) {
  const hist = history[serviceId];
  if (!hist || hist.length === 0) return null;
  const cutoff = Date.now() - 24 * 60 * 60 * 1000;
  const recent = hist.filter(h => h.ts >= cutoff);
  if (recent.length === 0) return null;
  const up = recent.filter(h => h.status === 'up' || h.status === 'cors').length;
  return Math.round((up / recent.length) * 100);
}

function renderCards() {
  const grid = document.getElementById('servicesGrid');
  const defaultIds = DEFAULT_SERVICES.map(s => s.id);
  grid.innerHTML = services.map(svc => {
    const lc = getLastCheck(svc.id);
    const status = lc ? lc.status : 'unknown';
    const rt = lc ? lc.responseTime : null;
    const uptime = getUptime24h(svc.id);
    const isCustom = !defaultIds.includes(svc.id);
    const isSelected = selectedService === svc.id;

    let rtClass = '';
    if (rt !== null) {
      if (rt < 300) rtClass = 'fast';
      else if (rt < 1000) rtClass = 'medium';
      else rtClass = 'slow';
    }

    let uptimeClass = 'good';
    if (uptime !== null) {
      if (uptime < 90) uptimeClass = 'bad';
      else if (uptime < 99) uptimeClass = 'warn';
    }

    const statusLabel = {
      up: 'UP',
      down: 'DOWN',
      cors: 'CORS BLOCKED',
      unknown: 'UNKNOWN'
    }[status] || 'UNKNOWN';

    return `
      <div class="service-card status-${status} ${isSelected ? 'selected' : ''}"
           onclick="selectService('${svc.id}')" data-id="${svc.id}">
        ${isCustom ? `<button class="delete-btn custom" onclick="event.stopPropagation();removeService('${svc.id}')" title="Remove">&times;</button>` : ''}
        <div class="service-card-header">
          <div class="service-name">${svc.name}</div>
          <div class="status-dot ${status}" title="${statusLabel}"></div>
        </div>
        <div class="service-url">${svc.url}</div>
        <div class="service-meta">
          <span>${lc ? new Date(lc.ts).toLocaleTimeString() : 'Not checked'}</span>
          <span class="response-time ${rtClass}">${rt !== null ? rt + ' ms' : '--'}</span>
        </div>
        ${uptime !== null ? `
          <div class="uptime-bar"><div class="uptime-fill ${uptimeClass}" style="width:${uptime}%"></div></div>
          <div class="uptime-label">${uptime}% uptime (24h)</div>
        ` : ''}
      </div>
    `;
  }).join('');
}

function updateSummary() {
  const counts = { up: 0, down: 0, cors: 0, unknown: 0 };
  services.forEach(svc => {
    const lc = getLastCheck(svc.id);
    const status = lc ? lc.status : 'unknown';
    counts[status] = (counts[status] || 0) + 1;
  });
  const total = services.length;
  const operational = counts.up + counts.cors;
  document.getElementById('summaryStats').textContent =
    `${operational}/${total} services operational` +
    (counts.cors > 0 ? ` (${counts.cors} CORS)` : '') +
    (counts.down > 0 ? ` / ${counts.down} DOWN` : '');

  const badge = document.getElementById('healthBadge');
  if (counts.down === 0 && counts.unknown === 0) {
    badge.className = 'health-badge healthy';
    badge.textContent = 'HEALTHY';
  } else if (counts.down > 0) {
    badge.className = 'health-badge critical';
    badge.textContent = 'CRITICAL';
  } else {
    badge.className = 'health-badge degraded';
    badge.textContent = 'DEGRADED';
  }
}

function selectService(id) {
  selectedService = id;
  renderCards();
  updateChart(id);
}

function updateChart(serviceId) {
  const svc = services.find(s => s.id === serviceId);
  if (!svc) return;

  document.getElementById('chartTitle').textContent = `Response Time - ${svc.name}`;

  const hist = history[serviceId] || [];
  const cutoff = Date.now() - 60 * 60 * 1000; // last hour
  const recent = hist.filter(h => h.ts >= cutoff);

  const labels = recent.map(h => new Date(h.ts).toLocaleTimeString());
  const data = recent.map(h => h.responseTime);
  const colors = recent.map(h => {
    if (h.status === 'up') return '#22c55e';
    if (h.status === 'cors') return '#f59e0b';
    return '#ef4444';
  });

  if (chart) chart.destroy();
  const ctx = document.getElementById('responseChart').getContext('2d');
  chart = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: 'Response Time (ms)',
        data,
        borderColor: '#3b82f6',
        backgroundColor: 'rgba(59,130,246,0.08)',
        fill: true,
        tension: 0.3,
        pointRadius: 4,
        pointBackgroundColor: colors,
        pointBorderColor: colors,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            afterLabel: (ctx) => {
              const entry = recent[ctx.dataIndex];
              return `Status: ${entry.status.toUpperCase()}`;
            }
          }
        }
      },
      scales: {
        x: {
          ticks: { maxTicksToShow: 10, font: { size: 10 } },
          grid: { display: false }
        },
        y: {
          beginAtZero: true,
          title: { display: true, text: 'ms', font: { size: 11 } },
          grid: { color: 'rgba(0,0,0,0.04)' }
        }
      }
    }
  });
}

function showNotification(msg) {
  const el = document.getElementById('notification');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 5000);

  // Browser notification
  if (Notification.permission === 'granted') {
    new Notification('Lumen Health', { body: msg, icon: '🔴' });
  } else if (Notification.permission !== 'denied') {
    Notification.requestPermission();
  }
}

function openAddModal() {
  document.getElementById('addModal').classList.add('active');
  document.getElementById('svcName').focus();
}

function closeAddModal() {
  document.getElementById('addModal').classList.remove('active');
  document.getElementById('svcName').value = '';
  document.getElementById('svcUrl').value = '';
}

function addService() {
  const name = document.getElementById('svcName').value.trim();
  const url = document.getElementById('svcUrl').value.trim();
  if (!name || !url) return;

  const id = 'custom-' + Date.now();
  const svc = { id, name, url };
  services.push(svc);
  history[id] = [];
  saveCustom();
  closeAddModal();
  renderCards();
  // Immediately check the new service
  checkService(svc).then(() => {
    saveHistory();
    renderCards();
    updateSummary();
  });
}

function removeService(id) {
  if (!confirm('Remove this service?')) return;
  services = services.filter(s => s.id !== id);
  delete history[id];
  saveCustom();
  saveHistory();
  if (selectedService === id) selectedService = null;
  renderCards();
  updateSummary();
}

function exportLogs() {
  const data = {
    exported: new Date().toISOString(),
    services: services.map(s => ({
      ...s,
      history: history[s.id] || [],
      uptime24h: getUptime24h(s.id),
    })),
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `health-log-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function toggleAutoRefresh() {
  const on = document.getElementById('autoRefreshToggle').checked;
  if (on) {
    autoRefreshInterval = setInterval(checkAll, 30000);
  } else {
    clearInterval(autoRefreshInterval);
    autoRefreshInterval = null;
  }
}

// Init
loadState();
renderCards();
updateSummary();
checkAll();
autoRefreshInterval = setInterval(checkAll, 30000);
document.getElementById('autoRefreshToggle').addEventListener('change', toggleAutoRefresh);

// Request notification permission
if ('Notification' in window && Notification.permission === 'default') {
  Notification.requestPermission();
}

// Keyboard shortcut
document.addEventListener('keydown', e => {
  if (e.key === 'r' && !e.ctrlKey && !e.metaKey && document.activeElement.tagName !== 'INPUT') {
    checkAll();
  }
});
</script>
