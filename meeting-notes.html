<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meeting Notes - Lumen Analytics</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #f8f9fc;
    color: #1a1a2e;
    min-height: 100vh;
  }
  .top-bar {
    display: flex; align-items: center; gap: 1rem; padding: 1rem 2rem;
    background: rgba(255,255,255,0.72); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid rgba(0,0,0,0.06); position: sticky; top: 0; z-index: 100;
  }
  .top-bar a { color: #3b82f6; text-decoration: none; font-size: 0.875rem; font-weight: 500; }
  .top-bar h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.02em; }
  .top-bar .spacer { flex: 1; }
  .search-box {
    padding: 0.5rem 0.75rem; border: 1px solid rgba(0,0,0,0.1); border-radius: 8px;
    background: rgba(255,255,255,0.8); font-family: inherit; font-size: 0.875rem; width: 240px;
    outline: none; transition: border-color 0.2s;
  }
  .search-box:focus { border-color: #3b82f6; }
  .layout { display: flex; min-height: calc(100vh - 57px); }
  .sidebar {
    width: 220px; min-width: 220px; padding: 1.25rem; border-right: 1px solid rgba(0,0,0,0.06);
    background: rgba(255,255,255,0.5); display: flex; flex-direction: column; gap: 0.25rem;
  }
  .sidebar button {
    display: flex; align-items: center; gap: 0.5rem; padding: 0.6rem 0.75rem;
    border: none; background: none; border-radius: 8px; font-family: inherit;
    font-size: 0.875rem; color: #4b5563; cursor: pointer; text-align: left; width: 100%;
    transition: background 0.15s;
  }
  .sidebar button:hover { background: rgba(0,0,0,0.04); }
  .sidebar button.active { background: rgba(59,130,246,0.1); color: #3b82f6; font-weight: 600; }
  .sidebar .sep { height: 1px; background: rgba(0,0,0,0.06); margin: 0.5rem 0; }
  .main { flex: 1; padding: 2rem; overflow-y: auto; max-height: calc(100vh - 57px); }
  .glass {
    background: rgba(255,255,255,0.72); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.6); border-radius: 16px; padding: 1.5rem;
  }
  .glass-sm { border-radius: 12px; padding: 1rem; }
  h2 { font-size: 1.25rem; font-weight: 700; margin-bottom: 1rem; letter-spacing: -0.02em; }
  h3 { font-size: 1rem; font-weight: 600; margin-bottom: 0.75rem; }
  label { font-size: 0.8rem; font-weight: 500; color: #6b7280; display: block; margin-bottom: 0.25rem; }
  input[type="text"], input[type="date"], input[type="datetime-local"], select, textarea {
    width: 100%; padding: 0.5rem 0.75rem; border: 1px solid rgba(0,0,0,0.1); border-radius: 8px;
    font-family: inherit; font-size: 0.875rem; background: #fff; outline: none;
    transition: border-color 0.2s;
  }
  input:focus, select:focus, textarea:focus { border-color: #3b82f6; }
  textarea { resize: vertical; min-height: 80px; }
  .btn {
    display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.5rem 1rem;
    border: none; border-radius: 8px; font-family: inherit; font-size: 0.8rem;
    font-weight: 600; cursor: pointer; transition: all 0.15s;
  }
  .btn-primary { background: #3b82f6; color: #fff; }
  .btn-primary:hover { background: #2563eb; }
  .btn-ghost { background: transparent; color: #6b7280; border: 1px solid rgba(0,0,0,0.1); }
  .btn-ghost:hover { background: rgba(0,0,0,0.04); }
  .btn-danger { background: #ef4444; color: #fff; }
  .btn-danger:hover { background: #dc2626; }
  .btn-sm { padding: 0.35rem 0.6rem; font-size: 0.75rem; }
  .btn-success { background: #10b981; color: #fff; }
  .btn-success:hover { background: #059669; }
  .tag {
    display: inline-block; padding: 0.15rem 0.5rem; border-radius: 99px;
    font-size: 0.7rem; font-weight: 600; background: rgba(59,130,246,0.1); color: #3b82f6;
  }
  .tag-green { background: rgba(16,185,129,0.1); color: #059669; }
  .tag-amber { background: rgba(245,158,11,0.1); color: #d97706; }
  .tag-red { background: rgba(239,68,68,0.1); color: #dc2626; }
  .tag-purple { background: rgba(139,92,246,0.1); color: #7c3aed; }
  .tag-pink { background: rgba(236,72,153,0.1); color: #db2777; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem; }
  .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; }
  .stat-card { text-align: center; }
  .stat-card .val { font-size: 1.75rem; font-weight: 700; color: #1a1a2e; }
  .stat-card .lbl { font-size: 0.75rem; color: #6b7280; margin-top: 0.25rem; }
  .meeting-list { display: flex; flex-direction: column; gap: 0.75rem; }
  .meeting-item {
    padding: 1rem 1.25rem; border-radius: 12px; cursor: pointer;
    background: rgba(255,255,255,0.72); border: 1px solid rgba(0,0,0,0.06);
    transition: all 0.15s; display: flex; flex-direction: column; gap: 0.4rem;
  }
  .meeting-item:hover { border-color: #3b82f6; box-shadow: 0 2px 12px rgba(59,130,246,0.08); }
  .meeting-item .title { font-weight: 600; font-size: 0.95rem; }
  .meeting-item .meta { font-size: 0.75rem; color: #6b7280; display: flex; gap: 0.75rem; flex-wrap: wrap; }
  .flex { display: flex; }
  .flex-wrap { flex-wrap: wrap; }
  .items-center { align-items: center; }
  .justify-between { justify-content: space-between; }
  .gap-05 { gap: 0.5rem; }
  .gap-1 { gap: 1rem; }
  .mb-1 { margin-bottom: 1rem; }
  .mb-05 { margin-bottom: 0.5rem; }
  .mt-1 { margin-top: 1rem; }
  .text-sm { font-size: 0.875rem; }
  .text-xs { font-size: 0.75rem; }
  .text-muted { color: #6b7280; }
  .hidden { display: none !important; }
  .bullet-list { list-style: disc; padding-left: 1.25rem; }
  .bullet-list li { font-size: 0.875rem; padding: 0.15rem 0; }
  .action-row {
    display: flex; align-items: center; gap: 0.5rem; padding: 0.4rem 0;
    border-bottom: 1px solid rgba(0,0,0,0.04); font-size: 0.875rem;
  }
  .action-row:last-child { border-bottom: none; }
  .action-row input[type="checkbox"] { width: 16px; height: 16px; accent-color: #3b82f6; cursor: pointer; }
  .action-row .assignee { font-size: 0.7rem; color: #6b7280; margin-left: auto; }
  .action-row .due { font-size: 0.7rem; margin-left: 0.5rem; }
  .action-row.overdue .due { color: #ef4444; font-weight: 600; }
  .action-row.done .text { text-decoration: line-through; color: #9ca3af; }
  .inline-add {
    display: flex; gap: 0.5rem; margin-top: 0.5rem;
  }
  .inline-add input { flex: 1; }
  /* Calendar */
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .cal-header { font-size: 0.7rem; font-weight: 600; color: #6b7280; text-align: center; padding: 0.25rem; }
  .cal-day {
    aspect-ratio: 1; border-radius: 8px; display: flex; align-items: center; justify-content: center;
    font-size: 0.8rem; cursor: pointer; position: relative; transition: background 0.15s;
  }
  .cal-day:hover { background: rgba(0,0,0,0.04); }
  .cal-day.today { font-weight: 700; color: #3b82f6; }
  .cal-day.has-meeting::after {
    content: ''; position: absolute; bottom: 4px; width: 6px; height: 6px;
    border-radius: 50%; background: #3b82f6;
  }
  .cal-day.empty { cursor: default; }
  .cal-day.empty:hover { background: none; }
  /* Timer */
  .timer-display {
    font-size: 2.5rem; font-weight: 700; font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em; text-align: center; padding: 0.5rem 0;
  }
  .timer-controls { display: flex; justify-content: center; gap: 0.5rem; }
  /* Toast */
  .toast {
    position: fixed; bottom: 2rem; right: 2rem; padding: 0.75rem 1.25rem;
    background: #1a1a2e; color: #fff; border-radius: 10px; font-size: 0.85rem;
    opacity: 0; transform: translateY(10px); transition: all 0.3s; z-index: 999; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  /* Filter bar */
  .filter-bar { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1rem; }
  .filter-bar select { width: auto; }
  /* Responsive */
  @media (max-width: 768px) {
    .sidebar { display: none; }
    .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
    .top-bar { padding: 0.75rem 1rem; }
    .main { padding: 1rem; }
  }
</style>
</head>
<body>

<div class="top-bar">
  <a href="index.html">&larr; Analytics</a>
  <h1>Meeting Notes</h1>
  <span class="spacer"></span>
  <input type="text" class="search-box" id="globalSearch" placeholder="Search meetings..." oninput="handleSearch()">
  <button class="btn btn-primary" onclick="showView('create')">+ New Meeting</button>
</div>

<div class="layout">
  <div class="sidebar">
    <button class="active" data-view="dashboard" onclick="showView('dashboard')">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg>
      Dashboard
    </button>
    <button data-view="list" onclick="showView('list')">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="4" x2="13" y2="4"/><line x1="3" y1="8" x2="13" y2="8"/><line x1="3" y1="12" x2="13" y2="12"/></svg>
      All Meetings
    </button>
    <button data-view="actions" onclick="showView('actions')">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 8 7 11 12 5"/><rect x="1" y="1" width="14" height="14" rx="2"/></svg>
      Action Items
    </button>
    <button data-view="calendar" onclick="showView('calendar')">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="12" height="11" rx="1"/><line x1="2" y1="7" x2="14" y2="7"/><line x1="5" y1="1" x2="5" y2="4"/><line x1="11" y1="1" x2="11" y2="4"/></svg>
      Calendar
    </button>
    <button data-view="templates" onclick="showView('templates')">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2H6a1 1 0 00-1 1v10a1 1 0 001 1h7a1 1 0 001-1V3a1 1 0 00-1-1z"/><path d="M3 5v9a1 1 0 001 1h7"/></svg>
      Templates
    </button>
    <div class="sep"></div>
    <button onclick="exportJSON()">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12v2a1 1 0 001 1h8a1 1 0 001-1v-2"/><polyline points="5 8 8 11 11 8"/><line x1="8" y1="3" x2="8" y2="11"/></svg>
      Export JSON
    </button>
    <button onclick="exportMarkdown()">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12v2a1 1 0 001 1h8a1 1 0 001-1v-2"/><polyline points="5 8 8 11 11 8"/><line x1="8" y1="3" x2="8" y2="11"/></svg>
      Export MD
    </button>
  </div>

  <div class="main" id="mainContent">
    <!-- Views injected by JS -->
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ---- Data layer ----
const STORAGE_KEY = 'lumen_meeting_notes';
const PROJECTS = ['CIBC','Smara','Lumen','Scoper','PJ Tales','Personal'];
const TYPES = ['Standup','1:1','Sprint Review','Architecture Review','Team Sync','Client Call','Other'];
const PROJECT_COLORS = {CIBC:'',Smara:'tag-green',Lumen:'tag-purple',Scoper:'tag-amber','PJ Tales':'tag-pink',Personal:'tag-red'};

function loadMeetings() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch { return []; }
}
function saveMeetings(m) { localStorage.setItem(STORAGE_KEY, JSON.stringify(m)); }
function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

// ---- Seed sample data ----
(function seedData() {
  let m = loadMeetings();
  if (m.length > 0) return;
  m = [
    {
      id: genId(), title: 'Sprint 14 Review', date: '2026-04-14T10:00',
      attendees: ['Sri','Meera','Arjun','Priya'],
      type: 'Sprint Review', project: 'Smara',
      agenda: ['Demo v1.2 features','Review velocity','Plan Sprint 15'],
      notes: 'Demoed Teams integration and AI agent endpoints. Velocity was 34 points, up from 28 last sprint. Discussed prioritizing webhook reliability for Sprint 15.',
      actions: [
        { id: genId(), text: 'Write webhook retry logic', assignee: 'Sri', due: '2026-04-21', done: true },
        { id: genId(), text: 'Update API docs for Teams endpoints', assignee: 'Arjun', due: '2026-04-18', done: false },
        { id: genId(), text: 'Set up staging environment for load testing', assignee: 'Priya', due: '2026-04-25', done: false }
      ],
      decisions: ['Prioritize webhook reliability over new features in Sprint 15','Move load testing to staging environment','Defer mobile SDK to Sprint 16'],
      timerSeconds: 2700
    },
    {
      id: genId(), title: 'Architecture Review: Scoper Agent Pipeline', date: '2026-04-22T14:00',
      attendees: ['Sri','Meera'],
      type: 'Architecture Review', project: 'Scoper',
      agenda: ['Review 9-agent pipeline design','Discuss LLM cost optimization','Evaluate caching strategy'],
      notes: 'Reviewed the full estimation pipeline. Identified that agent 4 (complexity scorer) and agent 7 (risk assessor) can run in parallel to reduce latency by ~40%. Discussed caching intermediate results in Redis with 24h TTL. Meera suggested adding a confidence score to final estimates.',
      actions: [
        { id: genId(), text: 'Implement parallel execution for agents 4 and 7', assignee: 'Sri', due: '2026-04-28', done: false },
        { id: genId(), text: 'Add Redis caching layer for intermediate results', assignee: 'Sri', due: '2026-04-30', done: false },
        { id: genId(), text: 'Design confidence score output format', assignee: 'Meera', due: '2026-05-02', done: false }
      ],
      decisions: ['Run complexity scorer and risk assessor in parallel','Use Redis with 24h TTL for caching','Add confidence scores to all estimates'],
      timerSeconds: 3420
    }
  ];
  saveMeetings(m);
})();

// ---- Templates ----
const TEMPLATES = {
  'Standup': {
    agenda: ['What I did yesterday','What I am doing today','Any blockers'],
    notes: '', actions: [], decisions: []
  },
  '1:1': {
    agenda: ['Wins since last time','Challenges and support needed','Career growth / learning','Action item review'],
    notes: '', actions: [], decisions: []
  },
  'Sprint Review': {
    agenda: ['Demo completed work','Review sprint metrics','Retrospective highlights','Plan next sprint priorities'],
    notes: '', actions: [], decisions: []
  }
};

// ---- State ----
let currentView = 'dashboard';
let editingId = null;
let timerInterval = null;
let timerSeconds = 0;
let timerRunning = false;

// ---- Views ----
function showView(view, data) {
  currentView = view;
  document.querySelectorAll('.sidebar button[data-view]').forEach(b => {
    b.classList.toggle('active', b.dataset.view === view);
  });
  const c = document.getElementById('mainContent');
  switch(view) {
    case 'dashboard': c.innerHTML = renderDashboard(); initCharts(); break;
    case 'list': c.innerHTML = renderList(); break;
    case 'create': c.innerHTML = renderForm(data); break;
    case 'detail': c.innerHTML = renderDetail(data); break;
    case 'actions': c.innerHTML = renderActions(); break;
    case 'calendar': c.innerHTML = renderCalendar(); break;
    case 'templates': c.innerHTML = renderTemplates(); break;
  }
}

// ---- Dashboard ----
function renderDashboard() {
  const m = loadMeetings();
  const now = new Date();
  const weekStart = new Date(now); weekStart.setDate(now.getDate() - now.getDay());
  weekStart.setHours(0,0,0,0);
  const thisWeek = m.filter(mt => new Date(mt.date) >= weekStart);
  const allActions = m.flatMap(mt => mt.actions || []);
  const open = allActions.filter(a => !a.done).length;
  const closed = allActions.filter(a => a.done).length;
  const overdue = allActions.filter(a => !a.done && a.due && new Date(a.due) < now).length;
  // Frequent attendees
  const freq = {};
  m.forEach(mt => (mt.attendees||[]).forEach(a => { freq[a] = (freq[a]||0) + 1; }));
  const topAttendees = Object.entries(freq).sort((a,b) => b[1]-a[1]).slice(0,5);

  return `
    <div class="grid-4 mb-1">
      <div class="glass glass-sm stat-card"><div class="val">${thisWeek.length}</div><div class="lbl">Meetings this week</div></div>
      <div class="glass glass-sm stat-card"><div class="val">${m.length}</div><div class="lbl">Total meetings</div></div>
      <div class="glass glass-sm stat-card"><div class="val" style="color:#10b981">${closed}</div><div class="lbl">Actions closed</div></div>
      <div class="glass glass-sm stat-card"><div class="val" style="color:${overdue>0?'#ef4444':'#f59e0b'}">${open}</div><div class="lbl">Actions open${overdue?' ('+overdue+' overdue)':''}</div></div>
    </div>
    <div class="grid-2 mb-1">
      <div class="glass">
        <h3>Meetings by Type</h3>
        <canvas id="chartType" height="200"></canvas>
      </div>
      <div class="glass">
        <h3>Meetings by Project</h3>
        <canvas id="chartProject" height="200"></canvas>
      </div>
    </div>
    <div class="grid-2">
      <div class="glass">
        <h3>Top Attendees</h3>
        ${topAttendees.length === 0 ? '<p class="text-sm text-muted">No meetings yet</p>' :
          topAttendees.map(([n,c]) => `<div class="flex items-center justify-between" style="padding:0.3rem 0;border-bottom:1px solid rgba(0,0,0,0.04)"><span class="text-sm">${esc(n)}</span><span class="tag">${c} meeting${c>1?'s':''}</span></div>`).join('')}
      </div>
      <div class="glass">
        <h3>Recent Meetings</h3>
        ${m.slice().sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,5).map(mt => `
          <div class="flex items-center justify-between" style="padding:0.3rem 0;border-bottom:1px solid rgba(0,0,0,0.04);cursor:pointer" onclick="showView('detail','${mt.id}')">
            <span class="text-sm">${esc(mt.title)}</span>
            <span class="text-xs text-muted">${fmtDate(mt.date)}</span>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}
function initCharts() {
  const m = loadMeetings();
  const typeCounts = {}; TYPES.forEach(t => typeCounts[t]=0);
  const projCounts = {}; PROJECTS.forEach(p => projCounts[p]=0);
  m.forEach(mt => { typeCounts[mt.type] = (typeCounts[mt.type]||0)+1; projCounts[mt.project] = (projCounts[mt.project]||0)+1; });
  const colors = ['#3b82f6','#10b981','#f59e0b','#8b5cf6','#ef4444','#ec4899','#06b6d4'];
  const el1 = document.getElementById('chartType');
  const el2 = document.getElementById('chartProject');
  if (el1) new Chart(el1, { type:'doughnut', data:{ labels:TYPES, datasets:[{data:TYPES.map(t=>typeCounts[t]),backgroundColor:colors}] }, options:{ plugins:{legend:{position:'bottom',labels:{font:{family:'Inter',size:11}}}}, cutout:'55%' } });
  if (el2) new Chart(el2, { type:'doughnut', data:{ labels:PROJECTS, datasets:[{data:PROJECTS.map(p=>projCounts[p]),backgroundColor:colors}] }, options:{ plugins:{legend:{position:'bottom',labels:{font:{family:'Inter',size:11}}}}, cutout:'55%' } });
}

// ---- List ----
function renderList(filter) {
  let m = loadMeetings().sort((a,b) => new Date(b.date)-new Date(a.date));
  const q = (filter || document.getElementById('globalSearch')?.value || '').toLowerCase();
  if (q) m = m.filter(mt => mt.title.toLowerCase().includes(q) || (mt.attendees||[]).join(' ').toLowerCase().includes(q) || (mt.notes||'').toLowerCase().includes(q) || (mt.agenda||[]).join(' ').toLowerCase().includes(q));
  return `
    <h2>All Meetings (${m.length})</h2>
    <div class="meeting-list">
      ${m.length===0?'<p class="text-sm text-muted">No meetings found.</p>':''}
      ${m.map(mt => `
        <div class="meeting-item" onclick="showView('detail','${mt.id}')">
          <div class="flex items-center justify-between">
            <span class="title">${esc(mt.title)}</span>
            <span class="tag ${PROJECT_COLORS[mt.project]||''}">${esc(mt.project)}</span>
          </div>
          <div class="meta">
            <span>${fmtDate(mt.date)}</span>
            <span>${esc(mt.type)}</span>
            <span>${(mt.attendees||[]).length} attendee${(mt.attendees||[]).length!==1?'s':''}</span>
            <span>${(mt.actions||[]).filter(a=>!a.done).length} open actions</span>
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

// ---- Form ----
function renderForm(templateType) {
  const tpl = templateType && TEMPLATES[templateType] ? TEMPLATES[templateType] : null;
  const now = new Date(); const local = new Date(now.getTime()-now.getTimezoneOffset()*60000).toISOString().slice(0,16);
  editingId = null;
  return `
    <h2>New Meeting</h2>
    <div class="glass">
      <div class="grid-2 mb-1">
        <div><label>Title</label><input type="text" id="fTitle" placeholder="Meeting title"></div>
        <div><label>Date &amp; Time</label><input type="datetime-local" id="fDate" value="${local}"></div>
      </div>
      <div class="grid-2 mb-1">
        <div><label>Meeting Type</label><select id="fType">${TYPES.map(t=>`<option ${tpl&&templateType===t?'selected':''}>${t}</option>`).join('')}</select></div>
        <div><label>Project</label><select id="fProject">${PROJECTS.map(p=>`<option>${p}</option>`).join('')}</select></div>
      </div>
      <div class="mb-1"><label>Attendees (comma-separated)</label><input type="text" id="fAttendees" placeholder="Sri, Meera, Arjun"></div>

      <h3>Agenda</h3>
      <div id="agendaList">${(tpl?tpl.agenda:[]).map((a,i)=>`<div class="inline-add mb-05"><input type="text" class="agenda-input" value="${esc(a)}"><button class="btn btn-ghost btn-sm" onclick="this.parentElement.remove()">x</button></div>`).join('')}</div>
      <button class="btn btn-ghost btn-sm mt-1" onclick="addAgendaRow()">+ Add agenda item</button>

      <h3 class="mt-1">Discussion Notes</h3>
      <textarea id="fNotes" rows="4" placeholder="Free-text notes...">${tpl?tpl.notes:''}</textarea>

      <h3 class="mt-1">Action Items</h3>
      <div id="actionList"></div>
      <div class="inline-add mt-1">
        <input type="text" id="newActionText" placeholder="Action item">
        <input type="text" id="newActionAssignee" placeholder="Assignee" style="width:120px">
        <input type="date" id="newActionDue" style="width:150px">
        <button class="btn btn-ghost btn-sm" onclick="addActionRow()">+ Add</button>
      </div>

      <h3 class="mt-1">Decisions</h3>
      <div id="decisionList"></div>
      <button class="btn btn-ghost btn-sm mt-1" onclick="addDecisionRow()">+ Add decision</button>

      <div class="flex gap-1 mt-1" style="margin-top:1.5rem">
        <button class="btn btn-primary" onclick="saveMeeting()">Save Meeting</button>
        <button class="btn btn-ghost" onclick="showView('dashboard')">Cancel</button>
      </div>
    </div>

    <div class="glass mt-1">
      <h3>Meeting Timer</h3>
      <div class="timer-display" id="timerDisplay">00:00:00</div>
      <div class="timer-controls">
        <button class="btn btn-primary btn-sm" id="timerStartBtn" onclick="toggleTimer()">Start</button>
        <button class="btn btn-ghost btn-sm" onclick="resetTimer()">Reset</button>
      </div>
    </div>
  `;
}

function addAgendaRow(val) {
  const d = document.getElementById('agendaList');
  const row = document.createElement('div');
  row.className = 'inline-add mb-05';
  row.innerHTML = `<input type="text" class="agenda-input" value="${esc(val||'')}" placeholder="Agenda item"><button class="btn btn-ghost btn-sm" onclick="this.parentElement.remove()">x</button>`;
  d.appendChild(row);
  row.querySelector('input').focus();
}
function addActionRow() {
  const text = document.getElementById('newActionText').value.trim();
  if (!text) return;
  const assignee = document.getElementById('newActionAssignee').value.trim();
  const due = document.getElementById('newActionDue').value;
  const d = document.getElementById('actionList');
  const row = document.createElement('div');
  row.className = 'action-row';
  row.dataset.text = text; row.dataset.assignee = assignee; row.dataset.due = due;
  row.innerHTML = `<input type="checkbox"><span class="text">${esc(text)}</span><span class="assignee">${esc(assignee)}</span><span class="due">${due?fmtDateShort(due):''}</span><button class="btn btn-ghost btn-sm" onclick="this.parentElement.remove()" style="margin-left:0.5rem">x</button>`;
  d.appendChild(row);
  document.getElementById('newActionText').value = '';
  document.getElementById('newActionAssignee').value = '';
  document.getElementById('newActionDue').value = '';
}
function addDecisionRow(val) {
  const d = document.getElementById('decisionList');
  const row = document.createElement('div');
  row.className = 'inline-add mb-05';
  row.innerHTML = `<input type="text" class="decision-input" value="${esc(val||'')}" placeholder="Decision made"><button class="btn btn-ghost btn-sm" onclick="this.parentElement.remove()">x</button>`;
  d.appendChild(row);
  if (!val) row.querySelector('input').focus();
}

function saveMeeting() {
  const title = document.getElementById('fTitle').value.trim();
  if (!title) { toast('Please enter a title'); return; }
  const meeting = {
    id: editingId || genId(),
    title,
    date: document.getElementById('fDate').value,
    type: document.getElementById('fType').value,
    project: document.getElementById('fProject').value,
    attendees: document.getElementById('fAttendees').value.split(',').map(s=>s.trim()).filter(Boolean),
    agenda: [...document.querySelectorAll('.agenda-input')].map(i=>i.value.trim()).filter(Boolean),
    notes: document.getElementById('fNotes').value,
    actions: [...document.querySelectorAll('#actionList .action-row')].map(r => ({
      id: genId(), text: r.dataset.text, assignee: r.dataset.assignee, due: r.dataset.due,
      done: r.querySelector('input[type="checkbox"]').checked
    })),
    decisions: [...document.querySelectorAll('.decision-input')].map(i=>i.value.trim()).filter(Boolean),
    timerSeconds: timerSeconds
  };
  let meetings = loadMeetings();
  const idx = meetings.findIndex(m => m.id === meeting.id);
  if (idx >= 0) meetings[idx] = meeting; else meetings.push(meeting);
  saveMeetings(meetings);
  stopTimer();
  toast('Meeting saved');
  showView('detail', meeting.id);
}

// ---- Detail ----
function renderDetail(id) {
  const m = loadMeetings().find(mt => mt.id === id);
  if (!m) return '<p>Meeting not found.</p>';
  const now = new Date();
  return `
    <div class="flex items-center justify-between mb-1">
      <div>
        <h2 style="margin-bottom:0.25rem">${esc(m.title)}</h2>
        <div class="flex gap-05 flex-wrap items-center">
          <span class="tag ${PROJECT_COLORS[m.project]||''}">${esc(m.project)}</span>
          <span class="tag">${esc(m.type)}</span>
          <span class="text-sm text-muted">${fmtDate(m.date)}</span>
          ${m.timerSeconds?`<span class="text-xs text-muted">Duration: ${fmtTimer(m.timerSeconds)}</span>`:''}
        </div>
      </div>
      <div class="flex gap-05">
        <button class="btn btn-ghost btn-sm" onclick="copyFormatted('${m.id}')">Copy for Slack</button>
        <button class="btn btn-ghost btn-sm" onclick="editMeeting('${m.id}')">Edit</button>
        <button class="btn btn-danger btn-sm" onclick="deleteMeeting('${m.id}')">Delete</button>
      </div>
    </div>
    <div class="glass mb-1">
      <h3>Attendees</h3>
      <div class="flex gap-05 flex-wrap">${(m.attendees||[]).map(a=>`<span class="tag">${esc(a)}</span>`).join('')}</div>
    </div>
    ${(m.agenda||[]).length?`
    <div class="glass mb-1">
      <h3>Agenda</h3>
      <ul class="bullet-list">${m.agenda.map(a=>`<li>${esc(a)}</li>`).join('')}</ul>
    </div>`:''}
    ${m.notes?`
    <div class="glass mb-1">
      <h3>Discussion Notes</h3>
      <p class="text-sm" style="white-space:pre-wrap;line-height:1.6">${esc(m.notes)}</p>
    </div>`:''}
    ${(m.actions||[]).length?`
    <div class="glass mb-1">
      <h3>Action Items</h3>
      ${m.actions.map(a => {
        const overdue = !a.done && a.due && new Date(a.due) < now;
        return `<div class="action-row ${overdue?'overdue':''} ${a.done?'done':''}">
          <input type="checkbox" ${a.done?'checked':''} onchange="toggleAction('${m.id}','${a.id}',this.checked)">
          <span class="text">${esc(a.text)}</span>
          <span class="assignee">${esc(a.assignee||'')}</span>
          <span class="due">${a.due?fmtDateShort(a.due)+(overdue?' (overdue)':''):''}</span>
        </div>`;
      }).join('')}
    </div>`:''}
    ${(m.decisions||[]).length?`
    <div class="glass mb-1">
      <h3>Decisions</h3>
      <ul class="bullet-list">${m.decisions.map(d=>`<li>${esc(d)}</li>`).join('')}</ul>
    </div>`:''}
    <button class="btn btn-ghost" onclick="showView('list')">&larr; Back to list</button>
  `;
}

function toggleAction(meetingId, actionId, checked) {
  let meetings = loadMeetings();
  const m = meetings.find(mt => mt.id === meetingId);
  if (m) { const a = (m.actions||[]).find(ac => ac.id === actionId); if (a) a.done = checked; }
  saveMeetings(meetings);
}

function editMeeting(id) {
  const m = loadMeetings().find(mt => mt.id === id);
  if (!m) return;
  editingId = m.id;
  const c = document.getElementById('mainContent');
  c.innerHTML = renderForm();
  document.getElementById('fTitle').value = m.title;
  document.getElementById('fDate').value = m.date;
  document.getElementById('fType').value = m.type;
  document.getElementById('fProject').value = m.project;
  document.getElementById('fAttendees').value = (m.attendees||[]).join(', ');
  document.getElementById('fNotes').value = m.notes||'';
  // Re-populate agenda
  document.getElementById('agendaList').innerHTML = '';
  (m.agenda||[]).forEach(a => addAgendaRow(a));
  // Re-populate actions
  (m.actions||[]).forEach(a => {
    const d = document.getElementById('actionList');
    const row = document.createElement('div');
    row.className = 'action-row';
    row.dataset.text = a.text; row.dataset.assignee = a.assignee||''; row.dataset.due = a.due||'';
    row.innerHTML = `<input type="checkbox" ${a.done?'checked':''}><span class="text">${esc(a.text)}</span><span class="assignee">${esc(a.assignee||'')}</span><span class="due">${a.due?fmtDateShort(a.due):''}</span><button class="btn btn-ghost btn-sm" onclick="this.parentElement.remove()" style="margin-left:0.5rem">x</button>`;
    d.appendChild(row);
  });
  // Re-populate decisions
  document.getElementById('decisionList').innerHTML = '';
  (m.decisions||[]).forEach(d => addDecisionRow(d));
  timerSeconds = m.timerSeconds || 0;
  updateTimerDisplay();
}

function deleteMeeting(id) {
  if (!confirm('Delete this meeting?')) return;
  let meetings = loadMeetings().filter(m => m.id !== id);
  saveMeetings(meetings);
  toast('Meeting deleted');
  showView('list');
}

// ---- Actions view ----
function renderActions() {
  const m = loadMeetings();
  const now = new Date();
  let allActions = [];
  m.forEach(mt => (mt.actions||[]).forEach(a => allActions.push({...a, meetingId: mt.id, meetingTitle: mt.title, project: mt.project})));
  // Get unique assignees
  const assignees = [...new Set(allActions.map(a=>a.assignee).filter(Boolean))].sort();
  return `
    <h2>Action Items (${allActions.length})</h2>
    <div class="filter-bar">
      <select id="actionFilterAssignee" onchange="filterActions()"><option value="">All assignees</option>${assignees.map(a=>`<option>${esc(a)}</option>`).join('')}</select>
      <select id="actionFilterStatus" onchange="filterActions()"><option value="">All</option><option value="open">Open</option><option value="done">Done</option><option value="overdue">Overdue</option></select>
    </div>
    <div id="actionListView">${renderActionList(allActions, now)}</div>
  `;
}
function renderActionList(actions, now) {
  if (!actions.length) return '<p class="text-sm text-muted">No action items.</p>';
  return actions.map(a => {
    const overdue = !a.done && a.due && new Date(a.due) < now;
    return `<div class="action-row ${overdue?'overdue':''} ${a.done?'done':''}" style="padding:0.6rem 0">
      <input type="checkbox" ${a.done?'checked':''} onchange="toggleAction('${a.meetingId}','${a.id}',this.checked);showView('actions')">
      <span class="text">${esc(a.text)}</span>
      <span class="tag" style="margin-left:0.5rem;font-size:0.65rem">${esc(a.project)}</span>
      <span class="assignee">${esc(a.assignee||'Unassigned')}</span>
      <span class="due">${a.due?fmtDateShort(a.due)+(overdue?' (overdue)':''):''}</span>
    </div>`;
  }).join('');
}
function filterActions() {
  const assignee = document.getElementById('actionFilterAssignee').value;
  const status = document.getElementById('actionFilterStatus').value;
  const now = new Date();
  const m = loadMeetings();
  let allActions = [];
  m.forEach(mt => (mt.actions||[]).forEach(a => allActions.push({...a, meetingId: mt.id, meetingTitle: mt.title, project: mt.project})));
  if (assignee) allActions = allActions.filter(a => a.assignee === assignee);
  if (status === 'open') allActions = allActions.filter(a => !a.done);
  if (status === 'done') allActions = allActions.filter(a => a.done);
  if (status === 'overdue') allActions = allActions.filter(a => !a.done && a.due && new Date(a.due) < now);
  document.getElementById('actionListView').innerHTML = renderActionList(allActions, now);
}

// ---- Calendar ----
let calYear = 2026, calMonth = 3; // April = 3 (0-indexed)
function renderCalendar() {
  const m = loadMeetings();
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  const firstDay = new Date(calYear, calMonth, 1).getDay();
  const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const today = new Date();
  // meetings by day
  const meetingDays = {};
  m.forEach(mt => {
    const d = new Date(mt.date);
    if (d.getFullYear()===calYear && d.getMonth()===calMonth) {
      const day = d.getDate();
      if (!meetingDays[day]) meetingDays[day] = [];
      meetingDays[day].push(mt);
    }
  });
  let cells = '';
  for (let i=0;i<firstDay;i++) cells += '<div class="cal-day empty"></div>';
  for (let d=1;d<=daysInMonth;d++) {
    const isToday = today.getFullYear()===calYear && today.getMonth()===calMonth && today.getDate()===d;
    const has = meetingDays[d];
    cells += `<div class="cal-day ${isToday?'today':''} ${has?'has-meeting':''}" onclick="showCalDay(${d})">${d}</div>`;
  }
  const selectedDayMeetings = '';
  return `
    <div class="flex items-center justify-between mb-1">
      <button class="btn btn-ghost btn-sm" onclick="calMonth--;if(calMonth<0){calMonth=11;calYear--;}showView('calendar')">&larr;</button>
      <h2 style="margin-bottom:0">${monthNames[calMonth]} ${calYear}</h2>
      <button class="btn btn-ghost btn-sm" onclick="calMonth++;if(calMonth>11){calMonth=0;calYear++;}showView('calendar')">&rarr;</button>
    </div>
    <div class="glass mb-1">
      <div class="cal-grid">
        ${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="cal-header">${d}</div>`).join('')}
        ${cells}
      </div>
    </div>
    <div id="calDayDetail"></div>
  `;
}
function showCalDay(day) {
  const m = loadMeetings().filter(mt => {
    const d = new Date(mt.date);
    return d.getFullYear()===calYear && d.getMonth()===calMonth && d.getDate()===day;
  });
  const el = document.getElementById('calDayDetail');
  if (!m.length) { el.innerHTML = `<p class="text-sm text-muted">No meetings on this day.</p>`; return; }
  el.innerHTML = `<div class="glass"><h3>Meetings on ${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(day).padStart(2,'0')}</h3>
    <div class="meeting-list">${m.map(mt => `
      <div class="meeting-item" onclick="showView('detail','${mt.id}')">
        <span class="title">${esc(mt.title)}</span>
        <div class="meta"><span>${esc(mt.type)}</span><span class="tag ${PROJECT_COLORS[mt.project]||''}">${esc(mt.project)}</span></div>
      </div>
    `).join('')}</div></div>`;
}

// ---- Templates ----
function renderTemplates() {
  return `
    <h2>Meeting Templates</h2>
    <p class="text-sm text-muted mb-1">Start a new meeting pre-filled with a common structure.</p>
    <div class="grid-3">
      ${Object.entries(TEMPLATES).map(([name, tpl]) => `
        <div class="glass" style="cursor:pointer" onclick="showView('create','${name}')">
          <h3>${esc(name)}</h3>
          <ul class="bullet-list">${tpl.agenda.map(a=>`<li class="text-sm">${esc(a)}</li>`).join('')}</ul>
          <button class="btn btn-primary btn-sm mt-1">Use Template</button>
        </div>
      `).join('')}
    </div>
  `;
}

// ---- Copy formatted ----
function copyFormatted(id) {
  const m = loadMeetings().find(mt => mt.id === id);
  if (!m) return;
  let text = `# ${m.title}\n`;
  text += `> ${fmtDate(m.date)} | ${m.type} | ${m.project}\n`;
  text += `> Attendees: ${(m.attendees||[]).join(', ')}\n\n`;
  if ((m.agenda||[]).length) {
    text += `## Agenda\n${m.agenda.map(a=>`- ${a}`).join('\n')}\n\n`;
  }
  if (m.notes) text += `## Notes\n${m.notes}\n\n`;
  if ((m.actions||[]).length) {
    text += `## Action Items\n${m.actions.map(a=>`${a.done?'[x]':'[ ]'} ${a.text}${a.assignee?' (@'+a.assignee+')':''}${a.due?' - due '+a.due:''}`).join('\n')}\n\n`;
  }
  if ((m.decisions||[]).length) {
    text += `## Decisions\n${m.decisions.map(d=>`- ${d}`).join('\n')}\n`;
  }
  navigator.clipboard.writeText(text).then(() => toast('Copied to clipboard'));
}

// ---- Export ----
function exportJSON() {
  const data = JSON.stringify(loadMeetings(), null, 2);
  downloadFile('meeting-notes.json', data, 'application/json');
  toast('Exported as JSON');
}
function exportMarkdown() {
  const meetings = loadMeetings().sort((a,b)=>new Date(b.date)-new Date(a.date));
  let md = '# Meeting Notes\n\n';
  meetings.forEach(m => {
    md += `## ${m.title}\n`;
    md += `**Date:** ${fmtDate(m.date)} | **Type:** ${m.type} | **Project:** ${m.project}\n`;
    md += `**Attendees:** ${(m.attendees||[]).join(', ')}\n\n`;
    if ((m.agenda||[]).length) md += `### Agenda\n${m.agenda.map(a=>`- ${a}`).join('\n')}\n\n`;
    if (m.notes) md += `### Notes\n${m.notes}\n\n`;
    if ((m.actions||[]).length) md += `### Action Items\n${m.actions.map(a=>`- [${a.done?'x':' '}] ${a.text}${a.assignee?' (@'+a.assignee+')':''}${a.due?' - due '+a.due:''}`).join('\n')}\n\n`;
    if ((m.decisions||[]).length) md += `### Decisions\n${m.decisions.map(d=>`- ${d}`).join('\n')}\n\n`;
    md += '---\n\n';
  });
  downloadFile('meeting-notes.md', md, 'text/markdown');
  toast('Exported as Markdown');
}
function downloadFile(name, content, type) {
  const blob = new Blob([content], {type});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  URL.revokeObjectURL(a.href);
}

// ---- Timer ----
function toggleTimer() {
  if (timerRunning) stopTimer(); else startTimer();
}
function startTimer() {
  timerRunning = true;
  const btn = document.getElementById('timerStartBtn');
  if (btn) btn.textContent = 'Pause';
  timerInterval = setInterval(() => { timerSeconds++; updateTimerDisplay(); }, 1000);
}
function stopTimer() {
  timerRunning = false;
  const btn = document.getElementById('timerStartBtn');
  if (btn) btn.textContent = 'Start';
  clearInterval(timerInterval);
}
function resetTimer() {
  stopTimer(); timerSeconds = 0; updateTimerDisplay();
}
function updateTimerDisplay() {
  const el = document.getElementById('timerDisplay');
  if (el) el.textContent = fmtTimer(timerSeconds);
}
function fmtTimer(s) {
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}

// ---- Search ----
function handleSearch() {
  if (currentView !== 'list') showView('list');
  else document.getElementById('mainContent').innerHTML = renderList();
}

// ---- Helpers ----
function esc(s) { if (!s) return ''; const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function fmtDate(d) {
  if (!d) return '';
  const dt = new Date(d);
  return dt.toLocaleDateString('en-US', {weekday:'short',month:'short',day:'numeric',year:'numeric',hour:'2-digit',minute:'2-digit'});
}
function fmtDateShort(d) {
  if (!d) return '';
  return new Date(d+'T00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});
}
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// ---- Init ----
showView('dashboard');
</script>
